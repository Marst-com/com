<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유 점수판</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #fff;
}

.scoreboard {
    width: 100%;
    max-width: 500px;
    text-align: center;
    padding: 30px;
}

.title {
    font-size: 24px;
    font-weight: 700;
}

.score {
    margin: 25px 0 40px;
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    width: 100px;
    height: 75px;
    border: 0;
    border-radius: 18px;
    background: #eee;
    font-size: 42px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.94);
}

.status {
    margin-top: 25px;
    color: #777;
    font-size: 14px;
}

.error {
    color: #d33;
}
</style>
</head>

<body>

<div class="scoreboard">
    <div class="title">점수</div>

    <div id="score" class="score">1</div>

    <div class="buttons">
        <button id="minus" type="button">−</button>
        <button id="plus" type="button">＋</button>
    </div>

    <div id="status" class="status">
        연결 중...
    </div>
</div>

<script>
const KEY = "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const GET_URL =
    "https://api.keyval.org/get/" + KEY;

const SET_URL = (value) =>
    "https://api.keyval.org/set/" +
    KEY + "/" +
    encodeURIComponent(String(value));

const scoreEl = document.getElementById("score");
const statusEl = document.getElementById("status");

let score = 1;
let busy = false;

function render(value) {
    score = Number(value);

    if (!Number.isFinite(score)) {
        score = 1;
    }

    scoreEl.textContent = score;
}

function status(text, error = false) {
    statusEl.textContent = text;
    statusEl.className =
        error ? "status error" : "status";
}

async function getScore() {
    const response = await fetch(
        GET_URL + "?t=" + Date.now(),
        {
            method: "GET",
            cache: "no-store"
        }
    );

    const body = await response.text();

    console.log("GET:", response.status, body);

    if (!response.ok) {
        throw new Error(
            "GET HTTP " +
            response.status +
            " : " +
            body
        );
    }

    /*
      KeyVal이 숫자를 그대로 주는 경우
      숫자만 추출
    */
    let value = body.trim();

    // JSON 응답도 대응
    try {
        const json = JSON.parse(value);

        if (typeof json === "object" && json !== null) {
            value =
                json.val ??
                json.value ??
                json.data ??
                value;
        }
    } catch {}

    value = String(value).trim();

    const number = Number(value);

    if (!Number.isFinite(number)) {
        throw new Error(
            "점수 해석 실패: " + body
        );
    }

    return number;
}

async function saveScore(value) {
    const response = await fetch(
        SET_URL(value),
        {
            method: "GET",
            cache: "no-store"
        }
    );

    const body = await response.text();

    console.log("SET:", response.status, body);

    if (!response.ok) {
        throw new Error(
            "SET HTTP " +
            response.status +
            " : " +
            body
        );
    }

    return body;
}

async function sync() {
    if (busy) return;

    try {
        const value = await getScore();

        render(value);
        status("🟢 연결됨");
    } catch (error) {
        console.error(error);

        status(
            "🔴 " + error.message,
            true
        );
    }
}

async function change(amount) {
    if (busy) return;

    busy = true;

    try {
        const current = await getScore();
        const next = current + amount;

        render(next);

        await saveScore(next);

        status("🟢 저장됨");
    } catch (error) {
        console.error(error);

        status(
            "🔴 " + error.message,
            true
        );
    }

    busy = false;
}

document
    .getElementById("plus")
    .addEventListener(
        "click",
        () => change(1)
    );

document
    .getElementById("minus")
    .addEventListener(
        "click",
        () => change(-1)
    );

// 최초 연결
sync();

// 1초마다 다른 기기의 점수 확인
setInterval(sync, 1000);
</script>

</body>
</html>
