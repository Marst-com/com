<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점수</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #f2f2f7;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

    color: #111;
}

/* 전체 */

.app {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

/* 상단 */

.header {
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 22px;
}

.header-title {
    font-size: 17px;
    font-weight: 650;
}

.status {
    display: flex;
    align-items: center;
    gap: 6px;

    font-size: 12px;
    color: #8e8e93;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: #34c759;
}

/* 중앙 */

.main {
    flex: 1;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 20px;
}

/* 점수 */

.score-box {
    width: min(82vw, 430px);
    aspect-ratio: 1 / 1;

    border-radius: 38%;

    background: #fff;

    display: flex;
    align-items: center;
    justify-content: center;

    box-shadow:
        0 2px 10px rgba(0,0,0,.025),
        0 15px 40px rgba(0,0,0,.045);
}

.score {
    margin: 0;

    font-size: clamp(110px, 27vw, 190px);

    font-weight: 750;

    letter-spacing: -7px;

    line-height: 1;

    user-select: none;

    color: #111;
}

.score.pop {
    animation: pop .2s ease-out;
}

@keyframes pop {

    0% {
        transform: scale(.9);
        opacity: .55;
    }

    60% {
        transform: scale(1.06);
        opacity: 1;
    }

    100% {
        transform: scale(1);
    }
}

/* 버튼 */

.controls {
    width: min(82vw, 430px);

    display: grid;
    grid-template-columns: 1fr 1fr;

    gap: 12px;

    margin-top: 18px;
}

button {
    height: 76px;

    border: none;
    border-radius: 24px;

    font-family: inherit;

    font-size: 34px;
    font-weight: 400;

    cursor: pointer;

    transition:
        transform .1s,
        background .15s;
}

button:active {
    transform: scale(.94);
}

.minus {
    background: #e5e5ea;
    color: #3a3a3c;
}

.minus:hover {
    background: #dcdce1;
}

.plus {
    background: #007aff;
    color: white;
}

.plus:hover {
    background: #006ee6;
}

/* 하단 */

.footer {
    height: 48px;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #aeaeb2;

    font-size: 11px;
}

/* 작은 화면 */

@media (max-height: 650px) {

    .header {
        height: 54px;
    }

    .score-box {
        width: min(65vw, 300px);
    }

    .controls {
        width: min(65vw, 300px);
    }

    button {
        height: 62px;
    }
}

/* 모바일 */

@media (max-width: 450px) {

    .score-box {
        width: 82vw;
    }

    .controls {
        width: 82vw;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="header">

        <div class="header-title">
            점수
        </div>

        <div class="status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                연결됨
            </span>

        </div>

    </header>


    <main class="main">

        <div class="score-box">

            <div
                id="score"
                class="score"
            >
                1
            </div>

        </div>


        <div class="controls">

            <button
                id="minus"
                class="minus"
                type="button"
            >
                −
            </button>

            <button
                id="plus"
                class="plus"
                type="button"
            >
                ＋
            </button>

        </div>

    </main>


    <footer class="footer">
        자동 동기화
    </footer>

</div>


<script>
const KEY =
    "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const GET_URL =
    "https://api.keyval.org/get/" + KEY;

const SET_URL = (value) =>
    "https://api.keyval.org/set/" +
    KEY + "/" +
    encodeURIComponent(String(value));

const scoreEl =
    document.getElementById("score");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

let score = 1;
let busy = false;


/* 점수 */

function render(value, animate = true) {

    score = Number(value);

    if (!Number.isFinite(score)) {
        score = 1;
    }

    scoreEl.textContent = score;

    if (!animate) return;

    scoreEl.classList.remove("pop");

    void scoreEl.offsetWidth;

    scoreEl.classList.add("pop");

    setTimeout(() => {
        scoreEl.classList.remove("pop");
    }, 200);
}


/* 연결 */

function setConnection(ok) {

    if (ok) {

        statusText.textContent =
            "연결됨";

        statusText.style.color =
            "#8e8e93";

        statusDot.style.background =
            "#34c759";

    } else {

        statusText.textContent =
            "연결 실패";

        statusText.style.color =
            "#ff3b30";

        statusDot.style.background =
            "#ff3b30";
    }
}


/* 가져오기 */

async function getScore() {

    const response =
        await fetch(
            GET_URL + "?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

    const body =
        (await response.text()).trim();

    if (!response.ok) {

        throw new Error(
            "GET " +
            response.status +
            ": " +
            body
        );
    }

    let value = body;

    try {

        const json =
            JSON.parse(value);

        if (
            typeof json === "object" &&
            json !== null
        ) {

            value =
                json.val ??
                json.value ??
                json.data ??
                value;
        }

    } catch {}

    const number =
        Number(
            String(value).trim()
        );

    if (!Number.isFinite(number)) {

        throw new Error(
            "잘못된 점수"
        );
    }

    return number;
}


/* 저장 */

async function saveScore(value) {

    const response =
        await fetch(
            SET_URL(value),
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {

        throw new Error(
            "SET " +
            response.status
        );
    }
}


/* 동기화 */

async function sync() {

    if (busy) return;

    try {

        const value =
            await getScore();

        /*
         * DB 값과 현재 화면 값이
         * 다를 때만 애니메이션
         */
        if (value !== score) {

            render(
                value,
                true
            );
        }

        setConnection(true);

    } catch (error) {

        console.error(error);

        setConnection(false);
    }
}


/* 점수 변경 */

async function change(amount) {

    if (busy) return;

    busy = true;

    try {

        const current =
            await getScore();

        const next =
            current + amount;

        render(
            next,
            true
        );

        await saveScore(next);

        setConnection(true);

    } catch (error) {

        console.error(error);

        setConnection(false);
    }

    busy = false;
}


/* 버튼 */

document
    .getElementById("minus")
    .addEventListener(
        "click",
        () => change(-1)
    );

document
    .getElementById("plus")
    .addEventListener(
        "click",
        () => change(1)
    );


/* 시작 */

sync();

setInterval(
    sync,
    1000
);
</script>

</body>
</html>
