<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유 점수판</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        font-family: Arial, sans-serif;
    }

    .scoreboard {
        text-align: center;
        width: 100%;
        max-width: 500px;
        padding: 30px;
    }

    .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .score {
        font-size: 120px;
        line-height: 1;
        font-weight: 800;
        margin: 20px 0 40px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        width: 100px;
        height: 75px;
        border: none;
        border-radius: 18px;
        background: #eeeeee;
        font-size: 42px;
        font-weight: bold;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.94);
    }

    .status {
        margin-top: 25px;
        font-size: 14px;
        color: #777;
    }

    .error {
        color: #d33;
    }
</style>
</head>

<body>

<div class="scoreboard">
    <div class="title">점수판</div>

    <div id="score" class="score">1</div>

    <div class="buttons">
        <button id="minus" type="button">−</button>
        <button id="plus" type="button">＋</button>
    </div>

    <div id="status" class="status">
        연결 중...
    </div>
</div>

<script>
const PANTRY_ID = "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";
const BASKET = "score";

const API =
    `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET}`;

async function loadScore() {
    try {
        const response = await fetch(API, {
            method: "GET",
            cache: "no-store"
        });

        const text = await response.text();

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${text}`);
        }

        const data = JSON.parse(text);

        score = Number(data.score ?? 1);
        scoreElement.textContent = score;

        setStatus("🟢 연결됨");

    } catch (error) {
        console.error(error);
        setStatus("🔴 " + error.message, true);
    }
}

async function saveScore(value) {
    const response = await fetch(API, {
        method: "PUT",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            score: value
        })
    });

    const text = await response.text();

    if (!response.ok) {
        throw new Error(`HTTP ${response.status}: ${text}`);
    }
}
</script>
</body>
</html>
