```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유 점수판</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #fff;
}

.scoreboard {
    width: 100%;
    max-width: 500px;
    text-align: center;
    padding: 30px;
}

.title {
    font-size: 24px;
    font-weight: 700;
}

.score {
    margin: 25px 0 40px;
    font-size: 120px;
    font-weight: 800;
    line-height: 1;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

button {
    width: 100px;
    height: 75px;
    border: 0;
    border-radius: 18px;
    background: #eee;
    font-size: 42px;
    font-weight: bold;
    cursor: pointer;
}

button:active {
    transform: scale(.94);
}

.status {
    margin-top: 25px;
    color: #777;
    font-size: 14px;
}

.error {
    color: #d33;
}
</style>
</head>

<body>

<div class="scoreboard">
    <div class="title">점수</div>

    <div id="score" class="score">1</div>

    <div class="buttons">
        <button id="minus" type="button">−</button>
        <button id="plus" type="button">＋</button>
    </div>

    <div id="status" class="status">
        연결 중...
    </div>
</div>

<script>
const KEY = "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const GET_URL =
    "https://api.keyval.org/get/" + KEY;

function setURL(value) {
    return "https://api.keyval.org/set/" +
           KEY + "/" +
           encodeURIComponent(value);
}

const scoreElement = document.getElementById("score");
const statusElement = document.getElementById("status");

let score = 1;
let busy = false;

function render(value) {
    score = Number(value);

    if (!Number.isFinite(score)) {
        score = 1;
    }

    scoreElement.textContent = score;
}

function status(text, error = false) {
    statusElement.textContent = text;
    statusElement.className =
        error ? "status error" : "status";
}

async function getScore() {
    const response = await fetch(
        GET_URL + "?t=" + Date.now(),
        {
            cache: "no-store"
        }
    );

    if (!response.ok) {
        throw new Error("HTTP " + response.status);
    }

    const text = (await response.text()).trim();

    const value = Number(text);

    if (!Number.isFinite(value)) {
        throw new Error("잘못된 점수");
    }

    return value;
}

async function saveScore(value) {
    const response = await fetch(setURL(value), {
        method: "GET",
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error("저장 실패: HTTP " + response.status);
    }
}

async function sync() {
    try {
        const value = await getScore();

        if (value !== score) {
            render(value);
        }

        status("🟢 동기화됨");

    } catch (error) {
        console.error(error);
        status("🔴 연결 실패", true);
    }
}

async function change(amount) {
    if (busy) return;

    busy = true;

    try {
        // 다른 기기에서 바뀐 최신 점수를 먼저 가져옴
        let current;

        try {
            current = await getScore();
        } catch {
            current = score;
        }

        const next = current + amount;

        render(next);

        await saveScore(next);

        status("🟢 저장됨");

    } catch (error) {
        console.error(error);
        status("🔴 저장 실패", true);
    }

    busy = false;
}

document
    .getElementById("plus")
    .addEventListener("click", () => change(1));

document
    .getElementById("minus")
    .addEventListener("click", () => change(-1));

/*
    최초 연결
*/
sync();

/*
    0.5초마다 다른 기기의 점수 확인
*/
setInterval(() => {
    if (!busy) {
        sync();
    }
}, 500);
</script>

</body>
</html>
