<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duo Score</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030205;color:#fff;font-family:Inter,Pretendard,Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.bg{position:fixed;inset:0;pointer-events:none;background:
radial-gradient(circle at 50% 95%,rgba(123,45,220,.09),transparent 38%),
linear-gradient(180deg,#030205,#06030a)}
.panel{
position:absolute;z-index:5;left:50%;top:43%;transform:translate(-50%,-50%);
width:440px;height:330px;background:rgba(0,0,0,.96);
border:1px solid rgba(190,130,255,.18);
box-shadow:0 35px 120px rgba(0,0,0,.8),0 0 70px rgba(120,30,220,.06);
display:flex;flex-direction:column;align-items:center
}
.panel:before,.panel:after{content:"";position:absolute;background:#a855f7}
.panel:before{width:42px;height:1px;top:-1px;left:28px}
.panel:after{width:1px;height:42px;right:-1px;bottom:28px}
.top{
width:100%;padding:25px 30px 0;display:flex;
justify-content:space-between;color:#666;font-size:9px;letter-spacing:3px
}
.live{display:flex;align-items:center;gap:7px;color:#777}
.dot{width:5px;height:5px;border-radius:50%;background:#34c759;box-shadow:0 0 10px #34c759}
.label{margin-top:27px;font-size:11px;letter-spacing:7px;color:#777}
#score{margin-top:8px;font-size:112px;line-height:1;font-weight:600;letter-spacing:-7px}
#score.pop{animation:pop .22s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.sub{margin-top:5px;color:#555;font-size:9px;letter-spacing:2px}
.controls{display:flex;gap:9px;margin-top:25px}
button{
width:58px;height:35px;background:#08080a;color:#999;border:1px solid #222;
font-size:19px;cursor:pointer;transition:.15s
}
button:hover{color:#fff;border-color:#7540a8;background:#100a16}
button:active{transform:scale(.94)}
.bottom{
position:absolute;bottom:18px;width:100%;padding:0 28px;
display:flex;justify-content:space-between;color:#414044;font-size:8px;letter-spacing:1.5px
}
.line{position:absolute;height:1px;background:rgba(170,100,255,.12);top:54px;left:30px;right:30px}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="canvas"></canvas>

<div class="panel">
<div class="line"></div>
<div class="top">
<span>DUOMARST / SCORE SYSTEM</span>
<span class="live"><i class="dot" id="statusDot"></i><b id="statusText">SYNC</b></span>
</div>
<div class="label">SHARED SCORE</div>
<div id="score">1</div>
<div class="sub">LIVE SYNCHRONIZED VALUE</div>
<div class="controls">
<button id="minus">−</button>
<button id="plus">+</button>
</div>
<div class="bottom">
<span>NETWORK // ACTIVE</span>
<span>KEYVAL STORAGE</span>
</div>
</div>

<script>
const c=document.getElementById("canvas"),x=c.getContext("2d");
let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}resize();
addEventListener("resize",resize);

const N=78,COLS=13,ROWS=6,nodes=[],edges=[],set=new Set();
function purple(){return{h:255+Math.random()*38,s:70+Math.random()*25,l:48+Math.random()*27}}
function mix(a,b,t=.5){return{h:a.h+(b.h-a.h)*t,s:a.s+(b.s-a.s)*t,l:a.l+(b.l-a.l)*t}}
function rgb(q,a=1){
let h=q.h/360,s=q.s/100,l=q.l/100,r,g,b;
if(!s)r=g=b=l;else{let q2=l<.5?l*(1+s):l+s-l*s,p=2*l-q2,f=t=>{if(t<0)t++;if(t>1)t--;if(t<1/6)return p+(q2-p)*6*t;if(t<.5)return q2;if(t<2/3)return p+(q2-p)*(2/3-t)*6;return p};r=f(h+1/3);g=f(h);b=f(h-1/3)}
return`rgba(${r*255},${g*255},${b*255},${a})`;
}

for(let r=0;r<ROWS;r++)for(let col=0;col<COLS;col++){
let d=r/(ROWS-1),z=420-d*2500,w=900-d*650;
nodes.push({
x:(col/(COLS-1)-.5)*w+(Math.random()-.5)*80,
y:300+d*270+(Math.random()-.5)*65,z:z+(Math.random()-.5)*100,
color:purple(),size:1.5+Math.random()*2,phase:Math.random()*6.28
});
}
function edge(a,b){let k=a<b?a+"-"+b:b+"-"+a;if(!set.has(k)){set.add(k);edges.push({a,b})}}
for(let r=0;r<ROWS;r++)for(let j=0;j<COLS;j++){
let i=r*COLS+j;
if(j<COLS-1)edge(i,i+1);
if(r<ROWS-1){
edge(i,i+COLS);
if(j<COLS-1)edge(i,i+COLS+1);
if(j>0)edge(i,i+COLS-1);
}}
for(let i=0;i<N;i++)if(Math.random()<.25&&i+COLS*2<N)edge(i,i+COLS*2);

let rot=0,mx=0,my=0;
addEventListener("mousemove",e=>{mx=e.clientX/W-.5;my=e.clientY/H-.5});

function project(n,t){
let xx=n.x+Math.sin(t*.0006+n.phase)*7;
let yy=n.y+Math.cos(t*.0005+n.phase)*5;
let cy=Math.cos(rot+mx*.035),sy=Math.sin(rot+mx*.035);
let rx=xx*cy-n.z*sy,rz=xx*sy+n.z*cy;
let cx=Math.cos(-.48+my*.025),sx=Math.sin(-.48+my*.025);
let ry=yy*cx-rz*sx,zz=yy*sx+rz*cx;
let p=1050/(1050+zz);
return{x:W*.5+rx*p,y:H*.72+ry*p,z:zz,s:p}
}
function draw(t){
x.fillStyle="#030205";x.fillRect(0,0,W,H);
let g=x.createRadialGradient(W/2,H,0,W/2,H,H*.8);
g.addColorStop(0,"rgba(125,45,230,.075)");g.addColorStop(1,"transparent");
x.fillStyle=g;x.fillRect(0,H*.4,W,H*.6);
rot+=.000018;
let p=nodes.map(n=>project(n,t));
edges.forEach(e=>{
let a=p[e.a],b=p[e.b],d=Math.hypot(a.x-b.x,a.y-b.y);
if(d<5||d>300)return;
let col=mix(nodes[e.a].color,nodes[e.b].color);
x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);
x.strokeStyle=rgb(col,Math.min(.32,.18*(a.s+b.s)));
x.lineWidth=.55+.5*(a.s+b.s);x.stroke();
});
nodes.forEach((n,i)=>{
let q=p[i];if(q.x<-50||q.x>W+50||q.y<-50||q.y>H+50)return;
let r=Math.max(.6,n.size*q.s);
x.beginPath();x.arc(q.x,q.y,r*3,0,7);x.fillStyle=rgb(n.color,.025);x.fill();
x.beginPath();x.arc(q.x,q.y,r,0,7);x.fillStyle=rgb(n.color,Math.min(.9,q.s));x.fill();
});
requestAnimationFrame(draw)
}requestAnimationFrame(draw);

/* SCORE */
const KEY="6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";
const GET="https://api.keyval.org/get/"+KEY;
const SET=v=>"https://api.keyval.org/set/"+KEY+"/"+encodeURIComponent(v);
const scoreEl=document.getElementById("score"),status=document.getElementById("statusText"),dot=document.getElementById("statusDot");
let score=1,busy=false;

function render(v,anim=true){
score=Number(v);if(!Number.isFinite(score))score=1;
scoreEl.textContent=score;
if(anim){scoreEl.classList.remove("pop");void scoreEl.offsetWidth;scoreEl.classList.add("pop")}
}
function conn(ok){status.textContent=ok?"SYNC":"OFFLINE";dot.style.background=ok?"#34c759":"#ff3b30";dot.style.boxShadow=ok?"0 0 10px #34c759":"0 0 10px #ff3b30"}
async function getScore(){
let r=await fetch(GET+"?t="+Date.now(),{cache:"no-store"}),b=(await r.text()).trim();
if(!r.ok)throw Error("GET "+r.status);
try{let j=JSON.parse(b);if(j&&typeof j==="object")b=j.val??j.value??j.data??b}catch{}
let n=Number(b);if(!Number.isFinite(n))throw Error("Invalid score");return n
}
async function save(v){let r=await fetch(SET(v),{cache:"no-store"});if(!r.ok)throw Error("SET "+r.status)}
async function sync(){if(busy)return;try{let v=await getScore();if(v!==score)render(v);conn(true)}catch(e){console.error(e);conn(false)}}
async function change(a){
if(busy)return;busy=true;
try{let v=await getScore();render(v+a);await save(v+a);conn(true)}
catch(e){console.error(e);conn(false)}busy=false
}
document.getElementById("minus").onclick=()=>change(-1);
document.getElementById("plus").onclick=()=>change(1);
sync();setInterval(sync,1000);
</script>
</body>
</html>
