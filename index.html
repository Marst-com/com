<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuoMarst Point Calendar</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070914;
    --panel:#0d1020;
    --panel2:#11152a;
    --line:#252b4d;
    --purple:#9b6cff;
    --blue:#5b8cff;
    --cyan:#43e6ff;
    --green:#52f5a5;
    --red:#ff5f8f;
    --text:#f4f5ff;
    --muted:#858cab;
}

body{
    min-height:100vh;
    color:var(--text);
    font-family:
        Inter,
        "Pretendard",
        "Noto Sans KR",
        Arial,
        sans-serif;

    background:
        radial-gradient(circle at 15% 10%,rgba(126,72,255,.20),transparent 25%),
        radial-gradient(circle at 85% 20%,rgba(53,202,255,.15),transparent 25%),
        radial-gradient(circle at 50% 100%,rgba(110,54,255,.12),transparent 30%),
        #070914;
}

/* subtle grid */
body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.22;
    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    position:relative;
    z-index:1;
    width:min(1450px,94vw);
    margin:auto;
    padding:28px 0 50px;
}

/* TOP */
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
    margin-bottom:28px;
}

.brand{
    display:flex;
    align-items:center;
    gap:13px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:13px;
    display:grid;
    place-items:center;

    background:linear-gradient(135deg,var(--purple),var(--cyan));
    color:white;
    font-weight:900;
    box-shadow:
        0 0 22px rgba(123,93,255,.45);
}

.brand-name{
    font-size:21px;
    font-weight:900;
    letter-spacing:-.5px;
}

.brand-sub{
    font-size:11px;
    color:var(--muted);
    margin-top:2px;
}

.sync{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 12px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(13,16,32,.8);
    color:var(--muted);
    font-size:12px;
}

.sync-dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 9px var(--green);
}

/* MAIN SCORE */
.hero{
    position:relative;
    overflow:hidden;

    padding:38px 42px 34px;
    border:1px solid rgba(145,112,255,.25);
    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            rgba(22,22,47,.95),
            rgba(9,14,30,.96)
        );

    box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        inset 0 0 50px rgba(103,72,255,.04);
}

.hero::after{
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    right:-100px;
    top:-180px;
    border-radius:50%;
    background:rgba(79,142,255,.12);
    filter:blur(40px);
    pointer-events:none;
}

.hero-label{
    color:var(--cyan);
    font-size:12px;
    font-weight:800;
    letter-spacing:2px;
    margin-bottom:8px;
}

.hero-date{
    color:var(--muted);
    font-size:14px;
    margin-bottom:16px;
}

.score{
    display:flex;
    align-items:baseline;
    gap:12px;
}

.score-number{
    font-size:clamp(60px,8vw,108px);
    line-height:.9;
    font-weight:950;
    letter-spacing:-6px;
    color:white;

    text-shadow:
        0 0 20px rgba(102,112,255,.35);
}

.score-unit{
    font-size:18px;
    color:var(--muted);
    font-weight:800;
}

/* POINT LINE */
.point-visual{
    margin-top:27px;
}

.point-line-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:9px;
    font-size:12px;
}

.point-line-title{
    color:#b9bfd9;
    font-weight:700;
}

.point-line-count{
    color:var(--cyan);
    font-weight:800;
}

.point-track{
    position:relative;
    height:16px;
    width:100%;

    border:1px solid #252c50;
    border-radius:999px;

    background:#080b18;
    overflow:hidden;
}

.point-fill{
    position:absolute;
    left:0;
    top:0;
    height:100%;
    width:0%;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            var(--purple),
            var(--blue),
            var(--cyan)
        );

    box-shadow:
        0 0 15px rgba(79,143,255,.6);

    transition:width .15s ease;
}

.point-markers{
    display:flex;
    gap:4px;
    margin-top:8px;
    height:7px;
    overflow:hidden;
}

.point-marker{
    flex:1;
    min-width:5px;
    max-width:24px;
    height:5px;
    border-radius:3px;
    background:#1b2040;
}

.point-marker.active{
    background:var(--cyan);
    box-shadow:0 0 7px rgba(67,230,255,.7);
}

.point-marker.negative{
    background:var(--red);
}

/* QUICK BUTTONS */
.quick{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:23px;
}

.quick button{
    min-width:54px;
    padding:9px 13px;

    border:1px solid #2a3158;
    border-radius:10px;

    background:#10152a;
    color:#dce2ff;

    transition:.12s;
}

.quick button:hover{
    border-color:var(--cyan);
    color:white;
    transform:translateY(-1px);
}

.quick button.plus{
    border-color:rgba(67,230,255,.28);
}

.quick button.minus{
    border-color:rgba(255,95,143,.28);
}

/* CONTENT */
.content{
    display:grid;
    grid-template-columns:minmax(0,1.6fr) 330px;
    gap:20px;
    margin-top:20px;
}

.card{
    border:1px solid var(--line);
    border-radius:22px;
    background:rgba(12,16,32,.9);
    box-shadow:0 12px 40px rgba(0,0,0,.2);
}

/* CALENDAR */
.calendar-card{
    padding:23px;
}

.calendar-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:19px;
}

.calendar-title{
    font-size:22px;
    font-weight:900;
}

.calendar-desc{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.month-buttons{
    display:flex;
    gap:7px;
}

.month-buttons button{
    width:36px;
    height:36px;

    border:1px solid var(--line);
    border-radius:10px;

    background:#11152a;
    color:white;
}

.month-buttons button:hover{
    border-color:var(--cyan);
}

.weekdays,
.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:7px;
}

.weekdays{
    margin-bottom:7px;
}

.weekday{
    text-align:center;
    color:#707796;
    font-size:11px;
    padding:7px 0;
    font-weight:800;
}

.day{
    min-height:76px;
    padding:9px;

    border:1px solid #202746;
    border-radius:13px;

    background:#0b1020;
    color:white;

    text-align:left;
    position:relative;

    transition:.1s;
}

.day:hover{
    border-color:#5865a2;
    background:#10162b;
}

.day.empty{
    visibility:hidden;
}

.day.selected{
    border-color:var(--cyan);
    box-shadow:
        0 0 0 1px rgba(67,230,255,.12),
        0 0 17px rgba(67,230,255,.10);
}

.day.today{
    box-shadow:inset 0 0 0 1px rgba(155,108,255,.65);
}

.day-number{
    font-size:12px;
    color:#858daa;
}

.day-score{
    margin-top:13px;
    font-size:18px;
    font-weight:900;
}

.day-score.positive{
    color:var(--cyan);
}

.day-score.negative{
    color:var(--red);
}

.day-score.zero{
    color:#59617e;
}

.day-bar{
    position:absolute;
    left:9px;
    right:9px;
    bottom:8px;
    height:3px;
    border-radius:3px;
    background:#202642;
    overflow:hidden;
}

.day-bar::after{
    content:"";
    display:block;
    width:var(--bar,0%);
    height:100%;
    background:linear-gradient(90deg,var(--purple),var(--cyan));
}

/* EDITOR */
.editor{
    padding:23px;
}

.editor-title{
    font-size:18px;
    font-weight:900;
}

.editor-date{
    margin-top:4px;
    color:var(--muted);
    font-size:12px;
}

.input-label{
    display:block;
    margin-top:24px;
    margin-bottom:8px;
    color:#8f97b6;
    font-size:11px;
    font-weight:800;
    letter-spacing:.5px;
}

.score-input{
    width:100%;
    height:58px;

    padding:0 16px;

    border:1px solid #2a3158;
    border-radius:14px;

    background:#080c1a;
    color:white;

    font-size:25px;
    font-weight:900;

    outline:none;
}

.score-input:focus{
    border-color:var(--cyan);
    box-shadow:0 0 0 3px rgba(67,230,255,.08);
}

.editor-preview{
    margin-top:13px;
    padding:13px 14px;

    border:1px solid #202746;
    border-radius:13px;

    background:#0a0e1d;
}

.preview-label{
    color:#747c9d;
    font-size:10px;
}

.preview-score{
    margin-top:4px;
    font-size:25px;
    font-weight:900;
}

.editor-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:14px;
}

.editor-buttons button{
    height:43px;
    border-radius:11px;
    border:1px solid var(--line);
    background:#11162b;
    color:white;
}

.editor-buttons .save{
    grid-column:1/-1;
    border-color:rgba(67,230,255,.35);
    background:linear-gradient(
        135deg,
        rgba(104,76,255,.28),
        rgba(42,179,255,.18)
    );
}

.editor-buttons button:hover{
    border-color:var(--cyan);
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    margin-top:20px;
}

.stat{
    padding:17px;
    border:1px solid var(--line);
    border-radius:16px;
    background:rgba(12,16,32,.82);
}

.stat-label{
    color:#777f9d;
    font-size:10px;
    font-weight:800;
}

.stat-value{
    margin-top:6px;
    font-size:22px;
    font-weight:900;
}

.progress{
    margin-top:9px;
    height:5px;
    border-radius:5px;
    overflow:hidden;
    background:#202641;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--purple),var(--cyan));
}

/* MOBILE */
@media(max-width:900px){
    .content{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:600px){
    .app{
        width:94vw;
        padding-top:15px;
    }

    .hero{
        padding:26px 22px;
        border-radius:21px;
    }

    .score-number{
        font-size:67px;
    }

    .calendar-card,
    .editor{
        padding:16px;
    }

    .day{
        min-height:65px;
        padding:7px;
    }

    .day-score{
        margin-top:9px;
        font-size:15px;
    }

    .day-bar{
        left:7px;
        right:7px;
    }

    .quick button{
        flex:1;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">D</div>

            <div>
                <div class="brand-name">DuoMarst Points</div>
                <div class="brand-sub">2026.10 — 2027.03</div>
            </div>
        </div>

        <div class="sync">
            <span class="sync-dot"></span>
            <span id="syncText">Connecting...</span>
        </div>
    </header>


    <!-- POINT FIRST -->
    <section class="hero">

        <div class="hero-label">TODAY'S SCORE</div>

        <div class="hero-date" id="heroDate">
            2026년 10월 4일 일요일
        </div>

        <div class="score">
            <div class="score-number" id="todayScore">+0</div>
            <div class="score-unit">POINTS</div>
        </div>

        <div class="point-visual">

            <div class="point-line-header">
                <span class="point-line-title">
                    TODAY'S ACCUMULATION
                </span>

                <span
                    class="point-line-count"
                    id="pointLineCount"
                >
                    0 / 50
                </span>
            </div>

            <div class="point-track">
                <div
                    class="point-fill"
                    id="pointFill"
                ></div>
            </div>

            <div
                class="point-markers"
                id="pointMarkers"
            ></div>

        </div>


        <div class="quick">

            <button class="minus" data-delta="-10">−10</button>
            <button class="minus" data-delta="-5">−5</button>
            <button class="minus" data-delta="-1">−1</button>

            <button class="plus" data-delta="1">+1</button>
            <button class="plus" data-delta="5">+5</button>
            <button class="plus" data-delta="10">+10</button>

        </div>

    </section>


    <div class="content">

        <!-- CALENDAR -->
        <section class="card calendar-card">

            <div class="calendar-head">

                <div>
                    <div
                        class="calendar-title"
                        id="monthTitle"
                    >
                        2026년 10월
                    </div>

                    <div
                        class="calendar-desc"
                        id="monthDesc"
                    >
                        점수 기록
                    </div>
                </div>

                <div class="month-buttons">
                    <button id="prevMonth">‹</button>
                    <button id="nextMonth">›</button>
                </div>

            </div>


            <div class="weekdays">
                <div class="weekday">SUN</div>
                <div class="weekday">MON</div>
                <div class="weekday">TUE</div>
                <div class="weekday">WED</div>
                <div class="weekday">THU</div>
                <div class="weekday">FRI</div>
                <div class="weekday">SAT</div>
            </div>

            <div
                class="calendar"
                id="calendar"
            ></div>

        </section>


        <!-- EDITOR -->
        <aside class="card editor">

            <div class="editor-title">
                Point Editor
            </div>

            <div
                class="editor-date"
                id="selectedDate"
            >
                2026년 10월 4일
            </div>

            <label class="input-label">
                SELECTED DAY
            </label>

            <input
                class="score-input"
                id="scoreInput"
                type="number"
                value="0"
            >

            <div class="editor-preview">

                <div class="preview-label">
                    CURRENT VALUE
                </div>

                <div
                    class="preview-score"
                    id="editorScore"
                >
                    +0
                </div>

            </div>


            <div class="editor-buttons">

                <button id="minusButton">
                    −1
                </button>

                <button id="plusButton">
                    +1
                </button>

                <button
                    class="save"
                    id="saveButton"
                >
                    SAVE POINT
                </button>

                <button id="resetButton">
                    RESET
                </button>

            </div>

        </aside>

    </div>


    <!-- TOTAL STATS -->
    <section class="stats">

        <div class="stat">
            <div class="stat-label">TOTAL SCORE</div>
            <div
                class="stat-value"
                id="totalScore"
            >
                +0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">POSITIVE</div>
            <div
                class="stat-value"
                id="positiveScore"
            >
                +0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">NEGATIVE</div>
            <div
                class="stat-value"
                id="negativeScore"
            >
                0
            </div>
        </div>

        <div class="stat">

            <div class="stat-label">
                PERIOD PROGRESS
            </div>

            <div
                class="stat-value"
                id="progressText"
            >
                0%
            </div>

            <div class="progress">
                <div
                    class="progress-fill"
                    id="progressBar"
                ></div>
            </div>

        </div>

    </section>

</div>


<script>
const BASE_KEY =
    "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const API =
    "https://api.keyval.org";

const START =
    new Date(2026, 9, 1);

const END =
    new Date(2027, 2, 31);

const SYNC_MONTHS = [
    "2026-10",
    "2026-11",
    "2026-12",
    "2027-01",
    "2027-02",
    "2027-03"
];

let data = {};

let selectedDate =
    new Date(2026, 9, 4);

let currentMonth =
    new Date(2026, 9, 1);

let saving = false;


/* ---------- DATE ---------- */

function dateKey(date){

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    const d =
        String(date.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${d}`;
}


function monthKey(date){

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    return `${y}-${m}`;
}


function isSameDay(a,b){

    return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
    );
}


function inRange(date){

    return (
        date >= START &&
        date <= END
    );
}


/* ---------- DATA ---------- */

function getScore(date){

    return Number(
        data[dateKey(date)] ?? 0
    );
}


function setScore(date,value){

    data[dateKey(date)] =
        Math.trunc(Number(value) || 0);
}


function formatScore(value){

    value = Number(value) || 0;

    return value > 0
        ? `+${value}`
        : `${value}`;
}


/* ---------- API ---------- */

async function getMonth(month){

    const key =
        `${BASE_KEY}-${month}`;

    const response =
        await fetch(
            `${API}/get/${key}`,
            {
                cache:"no-store"
            }
        );

    if(!response.ok){
        throw new Error("GET failed");
    }

    const raw =
        await response.text();

    let value =
        raw.trim();

    /*
      KeyVal 응답 형식이
      문자열 / JSON / {value:...}
      어느 쪽이어도 최대한 처리
    */

    try{

        const parsed =
            JSON.parse(value);

        if(typeof parsed === "string"){
            value = parsed;
        }
        else if(parsed?.value != null){
            value = parsed.value;
        }
        else if(
            parsed?.data?.value != null
        ){
            value = parsed.data.value;
        }

    }catch{}

    if(!value){
        return [];
    }

    if(Array.isArray(value)){
        return value.map(
            x => Number(x)||0
        );
    }

    return String(value)
        .split(",")
        .map(x => Number(x)||0);
}


async function saveMonth(month){

    const key =
        `${BASE_KEY}-${month}`;

    const days =
        new Date(
            Number(month.slice(0,4)),
            Number(month.slice(5,7)),
            0
        ).getDate();

    const values = [];

    for(
        let day = 1;
        day <= days;
        day++
    ){

        const date =
            `${month}-${String(day).padStart(2,"0")}`;

        values.push(
            Number(data[date] ?? 0)
        );
    }

    const value =
        values.join(",");

    const response =
        await fetch(
            `${API}/set/${key}/${encodeURIComponent(value)}`,
            {
                method:"GET",
                cache:"no-store"
            }
        );

    if(!response.ok){
        throw new Error("SET failed");
    }
}


/* ---------- LOAD ---------- */

async function loadData(){

    setSync("Loading...");

    try{

        const results =
            await Promise.all(
                SYNC_MONTHS.map(
                    month => getMonth(month)
                        .then(values => ({
                            month,
                            values
                        }))
                        .catch(() => ({
                            month,
                            values:null
                        }))
                )
            );

        for(const result of results){

            if(!result.values)
                continue;

            result.values.forEach(
                (score,index) => {

                    const date =
                        `${result.month}-${String(index+1).padStart(2,"0")}`;

                    data[date] = score;
                }
            );
        }

        setSync("Synced");

    }catch(error){

        console.error(error);

        setSync("Offline");
    }

    renderAll();
}


/* ---------- SAVE ---------- */

async function saveSelected(){

    if(saving)
        return;

    saving = true;

    const key =
        dateKey(selectedDate);

    const value =
        Math.trunc(
            Number(
                document.getElementById(
                    "scoreInput"
                ).value
            ) || 0
        );

    setScore(
        selectedDate,
        value
    );

    renderAll();

    setSync("Saving...");

    try{

        await saveMonth(
            monthKey(selectedDate)
        );

        setSync("Saved");

    }catch(error){

        console.error(error);

        setSync("Save failed");
    }

    saving = false;
}


/* ---------- RENDER ---------- */

function renderToday(){

    const score =
        getScore(selectedDate);

    const number =
        document.getElementById(
            "todayScore"
        );

    number.textContent =
        formatScore(score);

    number.style.color =
        score > 0
            ? "var(--cyan)"
            : score < 0
                ? "var(--red)"
                : "white";


    document.getElementById(
        "heroDate"
    ).textContent =
        selectedDate.toLocaleDateString(
            "ko-KR",
            {
                year:"numeric",
                month:"long",
                day:"numeric",
                weekday:"long"
            }
        );


    /*
      포인트 시각화

      0~50은 정확히 비례.
      50 이상은 꽉 찬 상태.
    */

    const positive =
        Math.max(score,0);

    const negative =
        Math.max(-score,0);

    const visual =
        Math.min(positive,50);

    document.getElementById(
        "pointFill"
    ).style.width =
        `${visual * 2}%`;


    document.getElementById(
        "pointLineCount"
    ).textContent =
        score >= 0
            ? `${positive} / 50`
            : `−${negative}`;


    const markers =
        document.getElementById(
            "pointMarkers"
        );

    markers.innerHTML = "";

    const count =
        Math.min(
            Math.max(Math.abs(score),1),
            50
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const marker =
            document.createElement("div");

        marker.className =
            "point-marker";

        if(score < 0){
            marker.classList.add(
                "negative"
            );
        }else{
            marker.classList.add(
                "active"
            );
        }

        markers.appendChild(marker);
    }
}


function renderCalendar(){

    const calendar =
        document.getElementById(
            "calendar"
        );

    calendar.innerHTML = "";


    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =
        `${year}년 ${month+1}월`;


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month+1,
            0
        ).getDate();


    /*
      앞/뒤 달 날짜는 표시하지 않고
      빈 칸만 만든다.
    */

    for(
        let i=0;
        i<firstDay;
        i++
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);
    }


    for(
        let day=1;
        day<=days;
        day++
    ){

        const date =
            new Date(
                year,
                month,
                day
            );

        const button =
            document.createElement("button");

        button.className =
            "day";

        if(
            isSameDay(
                date,
                selectedDate
            )
        ){
            button.classList.add(
                "selected"
            );
        }


        const today =
            new Date();

        if(
            isSameDay(
                date,
                today
            )
        ){
            button.classList.add(
                "today"
            );
        }


        const score =
            getScore(date);


        const scoreClass =
            score > 0
                ? "positive"
                : score < 0
                    ? "negative"
                    : "zero";


        const bar =
            Math.min(
                Math.abs(score) * 5,
                100
            );


        button.innerHTML = `
            <div class="day-number">
                ${day}
            </div>

            <div class="day-score ${scoreClass}">
                ${formatScore(score)}
            </div>

            <div
                class="day-bar"
                style="--bar:${bar}%"
            ></div>
        `;


        button.addEventListener(
            "click",
            () => {

                selectedDate =
                    new Date(date);

                currentMonth =
                    new Date(
                        date.getFullYear(),
                        date.getMonth(),
                        1
                    );

                renderAll();
            }
        );


        calendar.appendChild(button);
    }


    /*
      뒤쪽 빈칸
    */

    const total =
        firstDay + days;

    const remaining =
        (7 - (total % 7)) % 7;

    for(
        let i=0;
        i<remaining;
        i++
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);
    }
}


function renderEditor(){

    const score =
        getScore(selectedDate);

    document.getElementById(
        "selectedDate"
    ).textContent =
        selectedDate.toLocaleDateString(
            "ko-KR",
            {
                year:"numeric",
                month:"long",
                day:"numeric",
                weekday:"long"
            }
        );


    document.getElementById(
        "scoreInput"
    ).value =
        score;


    document.getElementById(
        "editorScore"
    ).textContent =
        formatScore(score);
}


function renderStats(){

    let total = 0;
    let positive = 0;
    let negative = 0;
    let active = 0;

    Object.values(data).forEach(
        value => {

            value =
                Number(value)||0;

            total += value;

            if(value > 0)
                positive += value;

            if(value < 0)
                negative += value;

            if(value !== 0)
                active++;
        }
    );


    document.getElementById(
        "totalScore"
    ).textContent =
        formatScore(total);


    document.getElementById(
        "positiveScore"
    ).textContent =
        `+${positive}`;


    document.getElementById(
        "negativeScore"
    ).textContent =
        negative;


    const totalDays =
        Math.round(
            (
                END - START
            ) /
            86400000
        ) + 1;


    const percent =
        Math.round(
            active /
            totalDays *
            100
        );


    document.getElementById(
        "progressText"
    ).textContent =
        `${percent}%`;


    document.getElementById(
        "progressBar"
    ).style.width =
        `${percent}%`;
}


function renderAll(){

    renderToday();
    renderCalendar();
    renderEditor();
    renderStats();
}


/* ---------- SYNC UI ---------- */

function setSync(text){

    document.getElementById(
        "syncText"
    ).textContent =
        text;
}


/* ---------- QUICK POINTS ---------- */

document.querySelectorAll(
    "[data-delta]"
).forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const delta =
                Number(
                    button.dataset.delta
                );

            const current =
                getScore(selectedDate);

            setScore(
                selectedDate,
                current + delta
            );

            document.getElementById(
                "scoreInput"
            ).value =
                getScore(selectedDate);

            renderAll();

            saveSelected();
        }
    );
});


/* ---------- EDITOR ---------- */

document.getElementById(
    "scoreInput"
).addEventListener(
    "input",
    () => {

        const value =
            Number(
                document.getElementById(
                    "scoreInput"
                ).value
            ) || 0;

        document.getElementById(
            "editorScore"
        ).textContent =
            formatScore(value);
    }
);


document.getElementById(
    "minusButton"
).addEventListener(
    "click",
    () => {

        const value =
            getScore(selectedDate) - 1;

        setScore(
            selectedDate,
            value
        );

        renderAll();
    }
);


document.getElementById(
    "plusButton"
).addEventListener(
    "click",
    () => {

        const value =
            getScore(selectedDate) + 1;

        setScore(
            selectedDate,
            value
        );

        renderAll();
    }
);


document.getElementById(
    "saveButton"
).addEventListener(
    "click",
    saveSelected
);


document.getElementById(
    "resetButton"
).addEventListener(
    "click",
    () => {

        setScore(
            selectedDate,
            0
        );

        renderAll();
    }
);


/* ---------- MONTH ---------- */

document.getElementById(
    "prevMonth"
).addEventListener(
    "click",
    () => {

        const next =
            new Date(
                currentMonth.getFullYear(),
                currentMonth.getMonth()-1,
                1
            );

        if(
            next < new Date(2026,9,1)
        )
            return;

        currentMonth = next;

        renderCalendar();
    }
);


document.getElementById(
    "nextMonth"
).addEventListener(
    "click",
    () => {

        const next =
            new Date(
                currentMonth.getFullYear(),
                currentMonth.getMonth()+1,
                1
            );

        if(
            next > new Date(2027,2,1)
        )
            return;

        currentMonth = next;

        renderCalendar();
    }
);


/* ---------- START ---------- */

renderAll();
loadData();

</script>
