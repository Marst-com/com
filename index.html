<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Score</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030406;
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================================
   중앙 시스템
========================================= */

.system {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


.panel {
    position: relative;

    width: 380px;
    height: 380px;

    background: #000;

    border: 1px solid #292d33;

    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;

    pointer-events: auto;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.02),
        0 35px 100px rgba(0,0,0,.8);
}


/* =========================================
   모서리 마커
========================================= */

.corner {
    position: absolute;

    width: 15px;
    height: 15px;

    border-color: #8b9199;

    opacity: .8;
}

.c1 {
    left: -1px;
    top: -1px;

    border-left: 1px solid;
    border-top: 1px solid;
}

.c2 {
    right: -1px;
    top: -1px;

    border-right: 1px solid;
    border-top: 1px solid;
}

.c3 {
    left: -1px;
    bottom: -1px;

    border-left: 1px solid;
    border-bottom: 1px solid;
}

.c4 {
    right: -1px;
    bottom: -1px;

    border-right: 1px solid;
    border-bottom: 1px solid;
}


/* =========================================
   상단
========================================= */

.header {
    position: absolute;

    top: 24px;
    left: 28px;
    right: 28px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    color: #747a83;

    font-size: 10px;
    letter-spacing: 2px;
}


.status {
    display: flex;
    align-items: center;

    gap: 7px;
}


.status-dot {
    width: 5px;
    height: 5px;

    background: #34c759;

    box-shadow:
        0 0 8px rgba(52,199,89,.55);
}


/* =========================================
   점수
========================================= */

.score {
    color: #f5f5f5;

    font-size: 104px;
    font-weight: 300;

    line-height: 1;

    letter-spacing: -6px;

    user-select: none;
}


.score.pop {
    animation: scorePop .2s ease;
}


@keyframes scorePop {

    0% {
        transform: scale(.86);
        opacity: .25;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}


/* =========================================
   구분선
========================================= */

.line {
    width: 150px;
    height: 1px;

    background: #25292e;

    margin-top: 24px;
    margin-bottom: 20px;
}


/* =========================================
   버튼
========================================= */

.controls {
    display: flex;

    gap: 8px;
}


button {
    width: 54px;
    height: 38px;

    border: 1px solid #292d33;

    background: #08090b;

    color: #c5c9ce;

    font-size: 18px;
    font-weight: 300;

    cursor: pointer;

    transition:
        background .12s ease,
        border-color .12s ease,
        color .12s ease,
        transform .12s ease;
}


button:hover {
    background: #15171a;

    border-color: #565c65;

    color: #fff;
}


button:active {
    transform: scale(.93);

    background: #202328;
}


/* =========================================
   하단
========================================= */

.footer {
    position: absolute;

    left: 28px;
    right: 28px;
    bottom: 23px;

    display: flex;
    justify-content: space-between;

    color: #4c525a;

    font-size: 9px;

    letter-spacing: 1.5px;
}


/* =========================================
   비네팅
========================================= */

.vignette {
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 24%,
            rgba(0,0,0,.15) 60%,
            rgba(0,0,0,.58) 100%
        );
}
</style>
</head>


<body>

<canvas id="network"></canvas>

<div class="vignette"></div>


<div class="system">

    <main class="panel">

        <div class="corner c1"></div>
        <div class="corner c2"></div>
        <div class="corner c3"></div>
        <div class="corner c4"></div>


        <div class="header">

            <span>
                SCORE / SYS
            </span>


            <div class="status">

                <span
                    class="status-dot"
                    id="statusDot">
                </span>

                <span id="statusText">
                    연결 중
                </span>

            </div>

        </div>


        <div
            id="score"
            class="score">
            1
        </div>


        <div class="line"></div>


        <div class="controls">

            <button id="minus">−</button>

            <button id="plus">+</button>

        </div>


        <div class="footer">

            <span>
                SHARED STATE
            </span>

            <span>
                LIVE
            </span>

        </div>

    </main>

</div>


<script>

/* =========================================================
   3D PLEXUS / LOW POLY ENGINE
========================================================= */

const canvas =
    document.getElementById("network");

const ctx =
    canvas.getContext("2d");


let width = 0;
let height = 0;
let dpr = 1;


/*
 * 노드 개수
 *
 * 너무 적으면 Plexus 느낌이 약하고
 * 너무 많으면 구형 PC에서 부담됨.
 */
const NODE_COUNT = 105;


/*
 * 연결 거리
 */
const LINK_DISTANCE = 240;


/*
 * 3D 공간 크기
 */
const SPACE = 850;


/*
 * 노드
 */
const nodes = [];


/*
 * 마우스는 노드를 움직이지 않고
 * 카메라 회전에만 아주 약하게 사용
 */
let mouseX = 0;
let mouseY = 0;


/*
 * 자동 회전
 */
let rotationX = 0;
let rotationY = 0;


/* =========================================================
   화면
========================================================= */

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );

    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


/* =========================================================
   3D 노드 생성
========================================================= */

function createNodes() {

    nodes.length = 0;


    for (
        let i = 0;
        i < NODE_COUNT;
        i++
    ) {

        nodes.push({

            /*
             * 3D 좌표
             */
            x:
                (Math.random() - .5) *
                SPACE,

            y:
                (Math.random() - .5) *
                SPACE,

            z:
                (Math.random() - .5) *
                SPACE,


            /*
             * 아주 느린 자체 움직임
             */
            vx:
                (Math.random() - .5) *
                .10,

            vy:
                (Math.random() - .5) *
                .10,

            vz:
                (Math.random() - .5) *
                .07,


            /*
             * 노드 크기
             */
            size:
                Math.random() * 1.5 +
                1.0
        });
    }
}


/* =========================================================
   마우스
========================================================= */

window.addEventListener(
    "pointermove",
    e => {

        mouseX =
            e.clientX;

        mouseY =
            e.clientY;
    }
);


/* =========================================================
   3D 회전
========================================================= */

function rotatePoint(
    x,
    y,
    z,
    rx,
    ry
) {

    /*
     * Y축 회전
     */
    const cosY =
        Math.cos(ry);

    const sinY =
        Math.sin(ry);


    const x1 =
        x * cosY -
        z * sinY;

    const z1 =
        x * sinY +
        z * cosY;


    /*
     * X축 회전
     */
    const cosX =
        Math.cos(rx);

    const sinX =
        Math.sin(rx);


    const y1 =
        y * cosX -
        z1 * sinX;

    const z2 =
        y * sinX +
        z1 * cosX;


    return {
        x: x1,
        y: y1,
        z: z2
    };
}


/* =========================================================
   3D → 화면 좌표
========================================================= */

function project(
    point
) {

    /*
     * 카메라
     */
    const camera =
        1050;


    /*
     * 원근
     */
    const scale =
        camera /
        (camera + point.z);


    return {

        x:
            width / 2 +
            point.x *
            scale,

        y:
            height / 2 +
            point.y *
            scale,

        scale,

        z:
            point.z
    };
}


/* =========================================================
   렌더링
========================================================= */

function drawNetwork() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * 자동 회전
     *
     * 매우 천천히 움직임
     */
    rotationY += 0.00075;
    rotationX += 0.00021;


    /*
     * 마우스는 카메라에만 영향
     */
    const targetMouseX =
        ((mouseX / width) - .5)
        * .10;

    const targetMouseY =
        ((mouseY / height) - .5)
        * .07;


    /*
     * 현재 회전값에 마우스 효과 추가
     */
    const finalRX =
        rotationX +
        targetMouseY;

    const finalRY =
        rotationY +
        targetMouseX;


    /*
     * 노드 이동
     */

    for (const node of nodes) {

        node.x += node.vx;
        node.y += node.vy;
        node.z += node.vz;


        /*
         * 공간 경계
         */

        const limit =
            SPACE / 2;


        if (
            node.x < -limit ||
            node.x > limit
        ) {
            node.vx *= -1;
        }


        if (
            node.y < -limit ||
            node.y > limit
        ) {
            node.vy *= -1;
        }


        if (
            node.z < -limit ||
            node.z > limit
        ) {
            node.vz *= -1;
        }
    }


    /*
     * 회전 + 투영
     */

    const projected =
        nodes.map(node => {

            const rotated =
                rotatePoint(
                    node.x,
                    node.y,
                    node.z,
                    finalRX,
                    finalRY
                );


            const screen =
                project(
                    rotated
                );


            return {

                node,

                x:
                    screen.x,

                y:
                    screen.y,

                scale:
                    screen.scale,

                z:
                    screen.z
            };
        });


    /* =====================================================
       LOW POLY FACE
       
       가까운 3개 노드가 서로 연결되어 있으면
       삼각형 면을 만든다.
    ===================================================== */

    const triangles = [];


    for (
        let i = 0;
        i < projected.length;
        i++
    ) {

        for (
            let j = i + 1;
            j < projected.length;
            j++
        ) {

            for (
                let k = j + 1;
                k < projected.length;
                k++
            ) {

                const a =
                    projected[i];

                const b =
                    projected[j];

                const c =
                    projected[k];


                /*
                 * 3D 거리
                 */

                const ab =
                    distance3D(
                        a.node,
                        b.node
                    );

                const ac =
                    distance3D(
                        a.node,
                        c.node
                    );

                const bc =
                    distance3D(
                        b.node,
                        c.node
                    );


                /*
                 * 삼각형이 너무 크면 버림
                 */

                if (
                    ab > LINK_DISTANCE ||
                    ac > LINK_DISTANCE ||
                    bc > LINK_DISTANCE
                ) {
                    continue;
                }


                /*
                 * 너무 찌그러진 삼각형 방지
                 */

                const maxSide =
                    Math.max(
                        ab,
                        ac,
                        bc
                    );

                const minSide =
                    Math.min(
                        ab,
                        ac,
                        bc
                    );


                if (
                    minSide <
                    maxSide * .28
                ) {
                    continue;
                }


                /*
                 * 중심 깊이
                 */

                const depth =
                    (
                        a.z +
                        b.z +
                        c.z
                    ) / 3;


                triangles.push({
                    a,
                    b,
                    c,
                    depth
                });
            }
        }
    }


    /*
     * 뒤쪽부터 그리기
     */

    triangles.sort(
        (a, b) =>
            b.depth -
            a.depth
    );


    /*
     * 삼각형 면
     */

    for (
        const triangle
        of triangles
    ) {

        const {
            a,
            b,
            c
        } = triangle;


        /*
         * 아주 희미한 Low Poly 면
         */

        const alpha =
            Math.max(
                .018,
                Math.min(
                    .075,
                    .045 -
                    triangle.depth /
                    25000
                )
            );


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );

        ctx.lineTo(
            c.x,
            c.y
        );

        ctx.closePath();


        ctx.fillStyle =
            `rgba(
                180,
                185,
                192,
                ${alpha}
            )`;

        ctx.fill();
    }


    /* =====================================================
       PLEXUS LINE
    ===================================================== */

    for (
        let i = 0;
        i < projected.length;
        i++
    ) {

        const a =
            projected[i];


        for (
            let j = i + 1;
            j < projected.length;
            j++
        ) {

            const b =
                projected[j];


            const distance =
                distance3D(
                    a.node,
                    b.node
                );


            if (
                distance >
                LINK_DISTANCE
            ) {
                continue;
            }


            /*
             * 가까울수록 진하게
             */

            const strength =
                1 -
                distance /
                LINK_DISTANCE;


            const alpha =
                .08 +
                strength * .32;


            ctx.beginPath();

            ctx.moveTo(
                a.x,
                a.y
            );

            ctx.lineTo(
                b.x,
                b.y
            );


            ctx.strokeStyle =
                `rgba(
                    190,
                    196,
                    204,
                    ${alpha}
                )`;


            ctx.lineWidth =
                .45 +
                strength * .65;


            ctx.stroke();
        }
    }


    /* =====================================================
       NODE
    ===================================================== */

    /*
     * 뒤 → 앞 순서
     */

    projected.sort(
        (a, b) =>
            b.z -
            a.z
    );


    for (
        const point
        of projected
    ) {

        /*
         * 화면 밖이면 생략
         */

        if (
            point.x < -20 ||
            point.x > width + 20 ||
            point.y < -20 ||
            point.y > height + 20
        ) {
            continue;
        }


        const radius =
            point.node.size *
            point.scale *
            1.8;


        /*
         * 노드
         */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(
                225,
                230,
                236,
                ${Math.max(
                    .35,
                    Math.min(
                        .9,
                        point.scale
                    )
                )}
            )`;


        ctx.arc(
            point.x,
            point.y,
            Math.max(
                .65,
                radius
            ),
            0,
            Math.PI * 2
        );


        ctx.fill();


        /*
         * 중심 코어
         */

        if (
            radius > .9
        ) {

            ctx.beginPath();

            ctx.fillStyle =
                "rgba(255,255,255,.9)";


            ctx.arc(
                point.x,
                point.y,
                Math.min(
                    radius * .32,
                    1.25
                ),
                0,
                Math.PI * 2
            );


            ctx.fill();
        }
    }


    requestAnimationFrame(
        drawNetwork
    );
}


/* =========================================================
   3D 거리
========================================================= */

function distance3D(
    a,
    b
) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    const dz =
        a.z - b.z;


    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );
}


/* =========================================================
   초기화
========================================================= */

window.addEventListener(
    "resize",
    () => {

        resize();

        createNodes();
    }
);


resize();

createNodes();

drawNetwork();


/* =========================================================
   SCORE SYSTEM
========================================================= */

const KEY =
    "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";


const GET_URL =
    "https://api.keyval.org/get/" +
    KEY;


const SET_URL =
    value =>
        "https://api.keyval.org/set/" +
        KEY +
        "/" +
        encodeURIComponent(
            String(value)
        );


const scoreEl =
    document.getElementById(
        "score"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const statusDot =
    document.getElementById(
        "statusDot"
    );


let score = 1;

let busy = false;


/* =========================================================
   SCORE RENDER
========================================================= */

function render(
    value,
    animate = true
) {

    score =
        Number(value);


    if (
        !Number.isFinite(score)
    ) {
        score = 1;
    }


    scoreEl.textContent =
        score;


    /*
     * DB 값이 같을 때는
     * 애니메이션 없음
     */

    if (!animate) {
        return;
    }


    scoreEl.classList.remove(
        "pop"
    );


    void scoreEl.offsetWidth;


    scoreEl.classList.add(
        "pop"
    );


    setTimeout(
        () => {

            scoreEl.classList.remove(
                "pop"
            );

        },
        200
    );
}


/* =========================================================
   CONNECTION
========================================================= */

function setConnection(
    ok
) {

    if (ok) {

        statusText.textContent =
            "연결됨";


        statusText.style.color =
            "#858b94";


        statusDot.style.background =
            "#34c759";


        statusDot.style.boxShadow =
            "0 0 8px rgba(52,199,89,.5)";

    } else {

        statusText.textContent =
            "연결 실패";


        statusText.style.color =
            "#ff453a";


        statusDot.style.background =
            "#ff453a";


        statusDot.style.boxShadow =
            "0 0 8px rgba(255,69,58,.45)";
    }
}


/* =========================================================
   GET
========================================================= */

async function getScore() {

    const response =
        await fetch(
            GET_URL +
            "?t=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );


    const body =
        (
            await response.text()
        ).trim();


    if (!response.ok) {

        throw new Error(
            "GET " +
            response.status +
            ": " +
            body
        );
    }


    let value =
        body;


    try {

        const json =
            JSON.parse(value);


        if (
            typeof json === "object" &&
            json !== null
        ) {

            value =
                json.val ??
                json.value ??
                json.data ??
                value;
        }

    } catch {}


    const number =
        Number(
            String(value).trim()
        );


    if (
        !Number.isFinite(number)
    ) {

        throw new Error(
            "잘못된 점수"
        );
    }


    return number;
}


/* =========================================================
   SET
========================================================= */

async function saveScore(
    value
) {

    const response =
        await fetch(
            SET_URL(value),
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "SET " +
            response.status
        );
    }
}


/* =========================================================
   SYNC
========================================================= */

async function sync() {

    if (busy) {
        return;
    }


    try {

        const value =
            await getScore();


        /*
         * 현재 화면과 DB가 같으면
         * 아무 애니메이션도 실행하지 않음
         */

        if (
            value !== score
        ) {

            render(
                value,
                true
            );
        }


        setConnection(
            true
        );

    } catch (error) {

        console.error(
            error
        );

        setConnection(
            false
        );
    }
}


/* =========================================================
   CHANGE
========================================================= */

async function change(
    amount
) {

    if (busy) {
        return;
    }


    busy = true;


    try {

        const current =
            await getScore();


        const next =
            current + amount;


        render(
            next,
            true
        );


        await saveScore(
            next
        );


        setConnection(
            true
        );

    } catch (error) {

        console.error(
            error
        );

        setConnection(
            false
        );
    }


    busy = false;
}


/* =========================================================
   BUTTON
========================================================= */

document
    .getElementById("minus")
    .addEventListener(
        "click",
        () => change(-1)
    );


document
    .getElementById("plus")
    .addEventListener(
        "click",
        () => change(1)
    );


/* =========================================================
   START
========================================================= */

sync();

setInterval(
    sync,
    1000
);

</script>

</body>
</html>
