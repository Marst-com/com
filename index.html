<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Score</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    background: #030405;

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
}

canvas {
    position: fixed;
    inset: 0;

    width: 100%;
    height: 100%;

    display: block;
}


/* =====================================================
   중앙 패널
===================================================== */

.system {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}


.panel {
    position: relative;

    width: 380px;
    height: 380px;

    background: #000;

    border: 1px solid #292d32;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    pointer-events: auto;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.015),
        0 30px 100px rgba(0,0,0,.85);
}


/* 모서리 */

.corner {
    position: absolute;

    width: 15px;
    height: 15px;

    border-color: #858b93;
}

.c1 {
    left: -1px;
    top: -1px;

    border-left: 1px solid;
    border-top: 1px solid;
}

.c2 {
    right: -1px;
    top: -1px;

    border-right: 1px solid;
    border-top: 1px solid;
}

.c3 {
    left: -1px;
    bottom: -1px;

    border-left: 1px solid;
    border-bottom: 1px solid;
}

.c4 {
    right: -1px;
    bottom: -1px;

    border-right: 1px solid;
    border-bottom: 1px solid;
}


/* =====================================================
   Header
===================================================== */

.header {
    position: absolute;

    top: 24px;
    left: 28px;
    right: 28px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    color: #747a82;

    font-size: 10px;
    letter-spacing: 2px;
}


.status {
    display: flex;
    align-items: center;

    gap: 7px;
}


.status-dot {
    width: 5px;
    height: 5px;

    background: #34c759;

    border-radius: 50%;

    box-shadow:
        0 0 8px rgba(52,199,89,.55);
}


/* =====================================================
   Score
===================================================== */

.score {
    color: #f5f5f5;

    font-size: 104px;
    font-weight: 300;

    line-height: 1;

    letter-spacing: -6px;

    user-select: none;
}


.score.pop {
    animation: pop .2s ease;
}


@keyframes pop {

    0% {
        opacity: .25;
        transform: scale(.86);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}


/* =====================================================
   Controls
===================================================== */

.line {
    width: 150px;
    height: 1px;

    background: #25282d;

    margin:
        24px 0
        20px;
}


.controls {
    display: flex;
    gap: 8px;
}


button {
    width: 54px;
    height: 38px;

    border: 1px solid #292d33;

    background: #08090a;

    color: #c4c8cd;

    font-size: 18px;
    font-weight: 300;

    cursor: pointer;

    transition:
        background .12s,
        border-color .12s,
        color .12s,
        transform .12s;
}


button:hover {
    background: #15171a;

    border-color: #555b63;

    color: #fff;
}


button:active {
    transform: scale(.93);

    background: #202328;
}


/* =====================================================
   Footer
===================================================== */

.footer {
    position: absolute;

    left: 28px;
    right: 28px;
    bottom: 23px;

    display: flex;
    justify-content: space-between;

    color: #4c525a;

    font-size: 9px;

    letter-spacing: 1.5px;
}


/* =====================================================
   Vignette
===================================================== */

.vignette {
    position: fixed;
    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(0,0,0,.12) 58%,
            rgba(0,0,0,.58) 100%
        );
}
</style>
</head>


<body>

<canvas id="network"></canvas>

<div class="vignette"></div>


<div class="system">

    <main class="panel">

        <div class="corner c1"></div>
        <div class="corner c2"></div>
        <div class="corner c3"></div>
        <div class="corner c4"></div>


        <div class="header">

            <span>
                SCORE / SYS
            </span>


            <div class="status">

                <span
                    class="status-dot"
                    id="statusDot">
                </span>

                <span id="statusText">
                    연결 중
                </span>

            </div>

        </div>


        <div
            id="score"
            class="score">
            1
        </div>


        <div class="line"></div>


        <div class="controls">

            <button id="minus">
                −
            </button>

            <button id="plus">
                +
            </button>

        </div>


        <div class="footer">

            <span>
                SHARED STATE
            </span>

            <span>
                LIVE
            </span>

        </div>

    </main>

</div>


<script>

/* =========================================================
   PLEXUS / LOW POLY ENGINE
========================================================= */

const canvas =
    document.getElementById("network");

const ctx =
    canvas.getContext("2d");


let width = 0;
let height = 0;
let dpr = 1;


/*
 * 너무 많으면 오래된 PC에서 부담된다.
 * 90개 정도면 충분히 복잡하게 보인다.
 */

const NODE_COUNT = 90;


/*
 * 한 점이 연결할 최대 이웃 수
 */

const MAX_LINKS = 5;


/*
 * 3D 공간
 */

const WORLD = 850;


/*
 * 카메라 거리
 */

const CAMERA = 1050;


/*
 * 노드
 */

const nodes = [];


/*
 * 마우스
 *
 * 점의 위치에는 영향을 주지 않는다.
 */

let mouseX = 0;
let mouseY = 0;


/*
 * 카메라 목표각
 */

let cameraX = 0;
let cameraY = 0;


/*
 * 실제 카메라각
 */

let currentX = 0;
let currentY = 0;


/*
 * 자동 회전
 */

let rotation = 0;


/* =========================================================
   Resize
========================================================= */

function resize() {

    dpr =
        Math.min(
            window.devicePixelRatio || 1,
            1.5
        );


    width =
        window.innerWidth;

    height =
        window.innerHeight;


    canvas.width =
        width * dpr;

    canvas.height =
        height * dpr;


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


/* =========================================================
   노드 생성
========================================================= */

function createNodes() {

    nodes.length = 0;


    for (
        let i = 0;
        i < NODE_COUNT;
        i++
    ) {

        nodes.push({

            /*
             * 3D 좌표
             */

            x:
                (Math.random() - .5) *
                WORLD,

            y:
                (Math.random() - .5) *
                WORLD,

            z:
                (Math.random() - .5) *
                WORLD,


            /*
             * 이동
             */

            vx:
                (Math.random() - .5) *
                .09,

            vy:
                (Math.random() - .5) *
                .09,

            vz:
                (Math.random() - .5) *
                .07,


            /*
             * 크기
             */

            size:
                1.1 +
                Math.random() * 1.3
        });
    }
}


/* =========================================================
   마우스
========================================================= */

window.addEventListener(
    "pointermove",
    e => {

        /*
         * -1 ~ +1
         */

        const x =
            (e.clientX / width - .5) *
            2;

        const y =
            (e.clientY / height - .5) *
            2;


        /*
         * 카메라만 움직인다.
         *
         * 점 자체는 절대 마우스를 따라가지 않음.
         */

        cameraY =
            x * .10;

        cameraX =
            y * .07;
    }
);


/* =========================================================
   3D 회전
========================================================= */

function rotatePoint(
    p,
    rx,
    ry
) {

    /*
     * Y축
     */

    const cy =
        Math.cos(ry);

    const sy =
        Math.sin(ry);


    const x =
        p.x * cy -
        p.z * sy;


    const z =
        p.x * sy +
        p.z * cy;


    /*
     * X축
     */

    const cx =
        Math.cos(rx);

    const sx =
        Math.sin(rx);


    const y =
        p.y * cx -
        z * sx;


    const finalZ =
        p.y * sx +
        z * cx;


    return {
        x,
        y,
        z: finalZ
    };
}


/* =========================================================
   Projection
========================================================= */

function project(p) {

    const depth =
        CAMERA /
        (CAMERA + p.z);


    return {

        x:
            width / 2 +
            p.x * depth,

        y:
            height / 2 +
            p.y * depth,

        scale:
            depth,

        z:
            p.z
    };
}


/* =========================================================
   3D 거리
========================================================= */

function distance3D(a, b) {

    const dx =
        a.x - b.x;

    const dy =
        a.y - b.y;

    const dz =
        a.z - b.z;


    return Math.sqrt(
        dx * dx +
        dy * dy +
        dz * dz
    );
}


/* =========================================================
   네트워크 생성
========================================================= */

/*
 * 매 프레임 삼각형을 전부 검사하지 않는다.
 *
 * 각 노드의 가까운 이웃을 한 번 찾고,
 * 그 연결관계를 이용해서 mesh를 만든다.
 */

function buildNetwork() {

    const links =
        nodes.map(
            () => []
        );


    for (
        let i = 0;
        i < nodes.length;
        i++
    ) {

        const candidates = [];


        for (
            let j = 0;
            j < nodes.length;
            j++
        ) {

            if (i === j) {
                continue;
            }


            candidates.push({

                index: j,

                distance:
                    distance3D(
                        nodes[i],
                        nodes[j]
                    )
            });
        }


        candidates.sort(
            (a, b) =>
                a.distance -
                b.distance
        );


        /*
         * 가까운 5개만
         */

        for (
            let k = 0;
            k <
            Math.min(
                MAX_LINKS,
                candidates.length
            );
            k++
        ) {

            /*
             * 너무 먼 점은 연결하지 않음
             */

            if (
                candidates[k].distance >
                300
            ) {
                continue;
            }


            links[i].push(
                candidates[k].index
            );
        }
    }


    /*
     * 중복 없는 edge
     */

    const edges = [];
    const edgeSet = new Set();


    for (
        let i = 0;
        i < links.length;
        i++
    ) {

        for (
            const j of links[i]
        ) {

            const a =
                Math.min(i, j);

            const b =
                Math.max(i, j);


            const key =
                a + ":" + b;


            if (
                edgeSet.has(key)
            ) {
                continue;
            }


            edgeSet.add(key);


            edges.push({
                a,
                b
            });
        }
    }


    /*
     * 삼각형
     *
     * 서로 연결된 세 점만 face로 만든다.
     */

    const triangles = [];


    for (
        let i = 0;
        i < nodes.length;
        i++
    ) {

        const set =
            new Set(
                links[i]
            );


        for (
            let x = 0;
            x < links[i].length;
            x++
        ) {

            for (
                let y = x + 1;
                y < links[i].length;
                y++
            ) {

                const b =
                    links[i][x];

                const c =
                    links[i][y];


                /*
                 * b와 c도 서로 연결되어야
                 * 진짜 삼각형
                 */

                if (
                    !links[b].includes(c)
                ) {
                    continue;
                }


                const triangle =
                    [
                        i,
                        b,
                        c
                    ].sort(
                        (a, b) =>
                            a - b
                    );


                const key =
                    triangle.join(",");


                /*
                 * 중복 제거
                 */

                if (
                    !triangles.some(
                        t =>
                            t.key === key
                    )
                ) {

                    triangles.push({
                        key,

                        a: triangle[0],
                        b: triangle[1],
                        c: triangle[2]
                    });
                }
            }
        }
    }


    return {
        edges,
        triangles
    };
}


const network =
    buildNetwork();


/* =========================================================
   Render
========================================================= */

function renderNetwork() {

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
     * 자동 회전
     */

    rotation += .00065;


    /*
     * 마우스 카메라 부드럽게
     */

    currentX +=
        (cameraX - currentX) *
        .025;

    currentY +=
        (cameraY - currentY) *
        .025;


    /*
     * 실제 회전
     */

    const rx =
        currentY;

    const ry =
        rotation +
        currentX;


    /*
     * 노드 이동
     */

    for (
        const node of nodes
    ) {

        node.x += node.vx;
        node.y += node.vy;
        node.z += node.vz;


        const half =
            WORLD / 2;


        /*
         * 공간 안에서 반사
         */

        if (
            node.x < -half ||
            node.x > half
        ) {
            node.vx *= -1;
        }


        if (
            node.y < -half ||
            node.y > half
        ) {
            node.vy *= -1;
        }


        if (
            node.z < -half ||
            node.z > half
        ) {
            node.vz *= -1;
        }
    }


    /*
     * Projection
     */

    const projected =
        nodes.map(
            node => {

                const rotated =
                    rotatePoint(
                        node,
                        rx,
                        ry
                    );


                const screen =
                    project(
                        rotated
                    );


                return {
                    node,
                    ...screen
                };
            }
        );


    /* =====================================================
       LOW POLY TRIANGLES
    ===================================================== */

    const visibleTriangles =
        network.triangles
            .map(t => {

                const a =
                    projected[t.a];

                const b =
                    projected[t.b];

                const c =
                    projected[t.c];


                return {
                    a,
                    b,
                    c,

                    depth:
                        (
                            a.z +
                            b.z +
                            c.z
                        ) / 3
                };
            });


    /*
     * 뒤쪽부터
     */

    visibleTriangles.sort(
        (a, b) =>
            b.depth -
            a.depth
    );


    /*
     * 면
     */

    for (
        const t
        of visibleTriangles
    ) {

        /*
         * 화면 밖이면 생략
         */

        if (
            (
                t.a.x < -100 &&
                t.b.x < -100 &&
                t.c.x < -100
            ) ||
            (
                t.a.x > width + 100 &&
                t.b.x > width + 100 &&
                t.c.x > width + 100
            )
        ) {
            continue;
        }


        ctx.beginPath();

        ctx.moveTo(
            t.a.x,
            t.a.y
        );

        ctx.lineTo(
            t.b.x,
            t.b.y
        );

        ctx.lineTo(
            t.c.x,
            t.c.y
        );

        ctx.closePath();


        /*
         * 매우 어두운 mesh 면
         */

        ctx.fillStyle =
            "rgba(150,155,162,.035)";


        ctx.fill();
    }


    /* =====================================================
       CONNECTIONS
    ===================================================== */

    for (
        const edge
        of network.edges
    ) {

        const a =
            projected[edge.a];

        const b =
            projected[edge.b];


        const dx =
            a.x - b.x;

        const dy =
            a.y - b.y;


        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );


        /*
         * 화면상 너무 먼 연결은 희미하게
         */

        const alpha =
            Math.max(
                .08,
                Math.min(
                    .42,
                    1 -
                    distance / 320
                )
            );


        ctx.beginPath();

        ctx.moveTo(
            a.x,
            a.y
        );

        ctx.lineTo(
            b.x,
            b.y
        );


        ctx.strokeStyle =
            `rgba(
                185,
                190,
                197,
                ${alpha}
            )`;


        ctx.lineWidth =
            .5;


        ctx.stroke();
    }


    /* =====================================================
       NODES
    ===================================================== */

    const sortedNodes =
        [...projected].sort(
            (a, b) =>
                b.z - a.z
        );


    for (
        const p
        of sortedNodes
    ) {

        if (
            p.x < -30 ||
            p.x > width + 30 ||
            p.y < -30 ||
            p.y > height + 30
        ) {
            continue;
        }


        /*
         * 깊이에 따른 크기
         */

        const radius =
            Math.max(
                .8,
                p.node.size *
                p.scale *
                1.8
            );


        /*
         * 노드
         */

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(
                225,
                230,
                236,
                ${Math.min(
                    .95,
                    .42 +
                    p.scale * .4
                )}
            )`;


        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI * 2
        );


        ctx.fill();


        /*
         * 중앙 코어
         */

        if (
            radius > 1.2
        ) {

            ctx.beginPath();

            ctx.fillStyle =
                "rgba(255,255,255,.95)";


            ctx.arc(
                p.x,
                p.y,
                Math.min(
                    1.1,
                    radius * .38
                ),
                0,
                Math.PI * 2
            );


            ctx.fill();
        }
    }


    requestAnimationFrame(
        renderNetwork
    );
}


/* =========================================================
   Start
========================================================= */

resize();

createNodes();


/*
 * 노드를 생성한 뒤
 * 연결 구조를 다시 생성
 */

const generatedNetwork =
    buildNetwork();


network.edges =
    generatedNetwork.edges;

network.triangles =
    generatedNetwork.triangles;


renderNetwork();


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   SCORE SYSTEM
========================================================= */

const KEY =
    "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";


const GET_URL =
    "https://api.keyval.org/get/" +
    KEY;


const SET_URL =
    value =>
        "https://api.keyval.org/set/" +
        KEY +
        "/" +
        encodeURIComponent(
            String(value)
        );


const scoreEl =
    document.getElementById(
        "score"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const statusDot =
    document.getElementById(
        "statusDot"
    );


let score = 1;

let busy = false;


/* =========================================================
   SCORE RENDER
========================================================= */

function renderScore(
    value,
    animate = true
) {

    score =
        Number(value);


    if (
        !Number.isFinite(score)
    ) {
        score = 1;
    }


    scoreEl.textContent =
        score;


    /*
     * 값이 실제로 변경됐을 때만
     * 애니메이션
     */

    if (!animate) {
        return;
    }


    scoreEl.classList.remove(
        "pop"
    );


    void scoreEl.offsetWidth;


    scoreEl.classList.add(
        "pop"
    );


    setTimeout(
        () => {

            scoreEl.classList.remove(
                "pop"
            );

        },
        200
    );
}


/* =========================================================
   Connection
========================================================= */

function setConnection(ok) {

    if (ok) {

        statusText.textContent =
            "연결됨";

        statusText.style.color =
            "#858b93";

        statusDot.style.background =
            "#34c759";

    } else {

        statusText.textContent =
            "연결 실패";

        statusText.style.color =
            "#ff453a";

        statusDot.style.background =
            "#ff453a";
    }
}


/* =========================================================
   GET SCORE
========================================================= */

async function getScore() {

    const response =
        await fetch(
            GET_URL +
            "?t=" +
            Date.now(),
            {
                cache: "no-store"
            }
        );


    const body =
        (
            await response.text()
        ).trim();


    if (!response.ok) {

        throw new Error(
            "GET " +
            response.status +
            ": " +
            body
        );
    }


    let value =
        body;


    try {

        const json =
            JSON.parse(value);


        if (
            typeof json === "object" &&
            json !== null
        ) {

            value =
                json.val ??
                json.value ??
                json.data ??
                value;
        }

    } catch {}


    const number =
        Number(
            String(value).trim()
        );


    if (
        !Number.isFinite(number)
    ) {

        throw new Error(
            "잘못된 점수"
        );
    }


    return number;
}


/* =========================================================
   SAVE SCORE
========================================================= */

async function saveScore(value) {

    const response =
        await fetch(
            SET_URL(value),
            {
                cache: "no-store"
            }
        );


    if (!response.ok) {

        throw new Error(
            "SET " +
            response.status
        );
    }
}


/* =========================================================
   SYNC
========================================================= */

async function sync() {

    if (busy) {
        return;
    }


    try {

        const value =
            await getScore();


        /*
         * DB 값과 현재 값이 다를 때만
         * 화면을 변경한다.
         */

        if (
            value !== score
        ) {

            renderScore(
                value,
                true
            );
        }


        setConnection(
            true
        );

    } catch (error) {

        console.error(
            error
        );

        setConnection(
            false
        );
    }
}


/* =========================================================
   CHANGE
========================================================= */

async function change(amount) {

    if (busy) {
        return;
    }


    busy = true;


    try {

        const current =
            await getScore();


        const next =
            current + amount;


        renderScore(
            next,
            true
        );


        await saveScore(
            next
        );


        setConnection(
            true
        );

    } catch (error) {

        console.error(
            error
        );

        setConnection(
            false
        );
    }


    busy = false;
}


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("minus")
    .addEventListener(
        "click",
        () => change(-1)
    );


document
    .getElementById("plus")
    .addEventListener(
        "click",
        () => change(1)
    );


/* =========================================================
   START SYNC
========================================================= */

sync();

setInterval(
    sync,
    1000
);

</script>
