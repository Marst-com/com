<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유 점수판</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #f5f7fb;
    color: #111827;
}

.scoreboard {
    width: min(92vw, 520px);
    padding: 42px 32px 32px;

    background: rgba(255, 255, 255, 0.92);

    border: 1px solid #e5e7eb;
    border-radius: 32px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.08);

    text-align: center;
}

.title {
    font-size: 18px;
    font-weight: 600;
    color: #6b7280;

    margin-bottom: 18px;
}

.score {
    font-size: clamp(100px, 22vw, 150px);
    font-weight: 800;
    letter-spacing: -6px;
    line-height: 1;

    margin: 0 0 42px;

    color: #111827;

    transition:
        transform 0.15s ease,
        opacity 0.15s ease;
}

.score.pop {
    transform: scale(1.08);
}

.buttons {
    display: flex;
    gap: 16px;
}

button {
    flex: 1;

    height: 82px;

    border: 0;
    border-radius: 22px;

    font-size: 42px;
    font-weight: 500;

    cursor: pointer;

    transition:
        transform 0.12s ease,
        background 0.15s ease,
        box-shadow 0.15s ease;
}

#minus {
    background: #f1f3f6;
    color: #374151;
}

#plus {
    background: #111827;
    color: white;
}

button:hover {
    transform: translateY(-2px);
}

#minus:hover {
    background: #e5e7eb;
}

#plus:hover {
    background: #1f2937;
    box-shadow: 0 8px 20px rgba(17, 24, 39, 0.18);
}

button:active {
    transform: scale(0.94);
}

.status {
    margin-top: 22px;

    font-size: 13px;
    font-weight: 500;

    color: #6b7280;

    min-height: 20px;
}

.status.error {
    color: #ef4444;
}

/* 모바일 */
@media (max-width: 480px) {
    .scoreboard {
        padding: 34px 22px 24px;
        border-radius: 26px;
    }

    .score {
        margin-bottom: 34px;
    }

    button {
        height: 72px;
        border-radius: 18px;
    }
}
</style>
</head>

<body>

<div class="scoreboard">

    <div class="title">
        점수
    </div>

    <div id="score" class="score">
        1
    </div>

    <div class="buttons">
        <button id="minus" type="button">−</button>
        <button id="plus" type="button">＋</button>
    </div>

    <div id="status" class="status">
        연결 중...
    </div>

</div>

<script>
const KEY = "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const GET_URL =
    "https://api.keyval.org/get/" + KEY;

const SET_URL = (value) =>
    "https://api.keyval.org/set/" +
    KEY + "/" +
    encodeURIComponent(String(value));

const scoreEl =
    document.getElementById("score");

const statusEl =
    document.getElementById("status");

let score = 1;
let busy = false;

function render(value) {
    score = Number(value);

    if (!Number.isFinite(score)) {
        score = 1;
    }

    scoreEl.textContent = score;

    scoreEl.classList.remove("pop");

    void scoreEl.offsetWidth;

    scoreEl.classList.add("pop");

    setTimeout(() => {
        scoreEl.classList.remove("pop");
    }, 150);
}

function status(text, error = false) {
    statusEl.textContent = text;
    statusEl.className =
        error ? "status error" : "status";
}

async function getScore() {

    const response = await fetch(
        GET_URL + "?t=" + Date.now(),
        {
            method: "GET",
            cache: "no-store"
        }
    );

    const body =
        (await response.text()).trim();

    console.log("GET:", response.status, body);

    if (!response.ok) {
        throw new Error(
            "GET HTTP " +
            response.status +
            " : " +
            body
        );
    }

    let value = body;

    try {
        const json = JSON.parse(value);

        if (
            typeof json === "object" &&
            json !== null
        ) {
            value =
                json.val ??
                json.value ??
                json.data ??
                value;
        }

    } catch {}

    const number = Number(
        String(value).trim()
    );

    if (!Number.isFinite(number)) {
        throw new Error(
            "점수 해석 실패: " + body
        );
    }

    return number;
}

async function saveScore(value) {

    const response = await fetch(
        SET_URL(value),
        {
            method: "GET",
            cache: "no-store"
        }
    );

    const body =
        await response.text();

    console.log(
        "SET:",
        response.status,
        body
    );

    if (!response.ok) {
        throw new Error(
            "SET HTTP " +
            response.status +
            " : " +
            body
        );
    }

    return body;
}

async function sync() {

    if (busy) return;

    try {

        const value =
            await getScore();

        render(value);

        status("🟢 연결됨");

    } catch (error) {

        console.error(error);

        status(
            "🔴 " + error.message,
            true
        );
    }
}

async function change(amount) {

    if (busy) return;

    busy = true;

    try {

        const current =
            await getScore();

        const next =
            current + amount;

        render(next);

        await saveScore(next);

        status("🟢 저장됨");

    } catch (error) {

        console.error(error);

        status(
            "🔴 " + error.message,
            true
        );
    }

    busy = false;
}

document
    .getElementById("plus")
    .addEventListener(
        "click",
        () => change(1)
    );

document
    .getElementById("minus")
    .addEventListener(
        "click",
        () => change(-1)
    );

sync();

setInterval(
    sync,
    1000
);
</script>

</body>
</html>
