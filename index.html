<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>점수판</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

:root {
    --bg: #0b0b0d;
    --panel: #111114;
    --line: #242428;
    --text: #f5f5f7;
    --sub: #77777f;
    --plus: #ffffff;
    --plusText: #09090b;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: var(--bg);
    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;
}

/* 전체 */

.app {
    width: min(92vw, 620px);
}

/* 위쪽 */

.top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 30px;

    padding: 0 4px;
}

.title {
    font-size: 15px;
    font-weight: 600;

    color: #aaaab1;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;

    font-size: 12px;

    color: #66666d;
}

.status-dot {
    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: #55555b;
}

/* 점수 */

.score-wrap {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    min-height: 300px;

    margin-bottom: 30px;
}

.score {
    margin: 0;

    font-size: clamp(150px, 31vw, 260px);

    font-weight: 800;

    letter-spacing: -14px;

    line-height: .8;

    color: var(--text);

    user-select: none;

    text-align: center;
}

.score.pop {
    animation: pop .18s cubic-bezier(.2,.8,.2,1);
}

@keyframes pop {

    0% {
        transform: scale(.92);
        opacity: .5;
    }

    65% {
        transform: scale(1.035);
        opacity: 1;
    }

    100% {
        transform: scale(1);
    }
}

/* 버튼 영역 */

.controls {
    display: grid;

    grid-template-columns: 100px 1fr;

    gap: 10px;

    height: 82px;
}

/* 공통 */

button {
    border: 0;

    border-radius: 18px;

    font-family: inherit;

    cursor: pointer;

    transition:
        transform .1s ease,
        background .15s ease;
}

button:active {
    transform: scale(.96);
}

/* 마이너스 */

.minus {
    background: var(--panel);

    border: 1px solid var(--line);

    color: #aaaab1;

    font-size: 34px;
}

.minus:hover {
    background: #18181c;
}

/* 플러스 */

.plus {
    background: var(--plus);

    color: var(--plusText);

    font-size: 38px;

    font-weight: 500;
}

.plus:hover {
    background: #e5e5e7;
}

/* 아래 */

.bottom {
    display: flex;
    justify-content: center;

    margin-top: 22px;
}

.sync {
    font-size: 11px;

    color: #45454b;
}

/* 에러 */

.status.error {
    color: #ef4444;
}

.status.error .status-dot {
    background: #ef4444;
}

/* 모바일 */

@media (max-width: 500px) {

    .app {
        width: 90vw;
    }

    .score-wrap {
        min-height: 250px;
    }

    .score {
        font-size: 150px;
        letter-spacing: -9px;
    }

    .controls {
        grid-template-columns: 82px 1fr;
        height: 76px;
    }

    .plus {
        font-size: 34px;
    }

    .minus {
        font-size: 30px;
    }
}

/* 세로가 짧은 기기 */

@media (max-height: 650px) {

    .score-wrap {
        min-height: 190px;
        margin-bottom: 20px;
    }

    .score {
        font-size: 130px;
    }

    .top {
        margin-bottom: 20px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="top">

        <div class="title">
            점수판
        </div>

        <div
            id="connection"
            class="status"
        >
            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                연결 중
            </span>
        </div>

    </div>


    <div class="score-wrap">

        <div
            id="score"
            class="score"
        >
            1
        </div>

    </div>


    <div class="controls">

        <button
            id="minus"
            class="minus"
            type="button"
        >
            −
        </button>

        <button
            id="plus"
            class="plus"
            type="button"
        >
            ＋
        </button>

    </div>


    <div class="bottom">

        <div class="sync">
            자동 동기화
        </div>

    </div>

</div>


<script>
const KEY =
    "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const GET_URL =
    "https://api.keyval.org/get/" + KEY;

const SET_URL = (value) =>
    "https://api.keyval.org/set/" +
    KEY + "/" +
    encodeURIComponent(String(value));

const scoreEl =
    document.getElementById("score");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const connection =
    document.getElementById("connection");

let score = 1;
let busy = false;


/* 점수 표시 */

function render(value, animate = true) {

    score = Number(value);

    if (!Number.isFinite(score)) {
        score = 1;
    }

    scoreEl.textContent = score;

    if (!animate) return;

    scoreEl.classList.remove("pop");

    void scoreEl.offsetWidth;

    scoreEl.classList.add("pop");

    setTimeout(() => {
        scoreEl.classList.remove("pop");
    }, 180);
}


/* 연결 상태 */

function setConnection(connected) {

    connection.className = "status";

    if (connected) {

        statusDot.style.background =
            "#4ade80";

        statusText.textContent =
            "연결됨";

    } else {

        statusDot.style.background =
            "#ef4444";

        statusText.textContent =
            "연결 실패";

        connection.classList.add("error");
    }
}


/* 가져오기 */

async function getScore() {

    const response =
        await fetch(
            GET_URL + "?t=" + Date.now(),
            {
                method: "GET",
                cache: "no-store"
            }
        );

    const body =
        (await response.text()).trim();

    if (!response.ok) {

        throw new Error(
            "GET HTTP " +
            response.status +
            " : " +
            body
        );
    }

    let value = body;

    try {

        const json =
            JSON.parse(value);

        if (
            typeof json === "object" &&
            json !== null
        ) {

            value =
                json.val ??
                json.value ??
                json.data ??
                value;
        }

    } catch {}

    const number =
        Number(
            String(value).trim()
        );

    if (!Number.isFinite(number)) {

        throw new Error(
            "점수 해석 실패: " +
            body
        );
    }

    return number;
}


/* 저장 */

async function saveScore(value) {

    const response =
        await fetch(
            SET_URL(value),
            {
                method: "GET",
                cache: "no-store"
            }
        );

    const body =
        await response.text();

    if (!response.ok) {

        throw new Error(
            "SET HTTP " +
            response.status +
            " : " +
            body
        );
    }

    return body;
}


/* 동기화 */

async function sync() {

    if (busy) return;

    try {

        const value =
            await getScore();

        /*
         * DB와 현재 화면의 값이
         * 다를 때만 애니메이션
         */
        if (value !== score) {
            render(value, true);
        }

        setConnection(true);

    } catch (error) {

        console.error(error);

        setConnection(false);
    }
}


/* + / - */

async function change(amount) {

    if (busy) return;

    busy = true;

    try {

        const current =
            await getScore();

        const next =
            current + amount;

        render(next, true);

        await saveScore(next);

        setConnection(true);

    } catch (error) {

        console.error(error);

        setConnection(false);
    }

    busy = false;
}


/* 이벤트 */

document
    .getElementById("plus")
    .addEventListener(
        "click",
        () => change(1)
    );

document
    .getElementById("minus")
    .addEventListener(
        "click",
        () => change(-1)
    );


/* 시작 */

sync();

setInterval(
    sync,
    1000
);
</script>

</body>
</html>
