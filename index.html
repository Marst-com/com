<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공유 점수판</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #ffffff;
        font-family: Arial, sans-serif;
    }

    .scoreboard {
        text-align: center;
        width: 100%;
        max-width: 500px;
        padding: 30px;
    }

    .title {
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 20px;
    }

    .score {
        font-size: 120px;
        line-height: 1;
        font-weight: 800;
        margin: 20px 0 40px;
    }

    .buttons {
        display: flex;
        justify-content: center;
        gap: 20px;
    }

    button {
        width: 100px;
        height: 75px;
        border: none;
        border-radius: 18px;
        background: #eeeeee;
        font-size: 42px;
        font-weight: bold;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.94);
    }

    .status {
        margin-top: 25px;
        font-size: 14px;
        color: #777;
    }

    .error {
        color: #d33;
    }
</style>
</head>

<body>

<div class="scoreboard">
    <div class="title">점수판</div>

    <div id="score" class="score">1</div>

    <div class="buttons">
        <button id="minus" type="button">−</button>
        <button id="plus" type="button">＋</button>
    </div>

    <div id="status" class="status">
        연결 중...
    </div>
</div>

<script>
const PANTRY_ID = "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";
const BASKET_NAME = "score";

const API =
    `https://getpantry.cloud/apiv1/pantry/${PANTRY_ID}/basket/${BASKET_NAME}`;

const scoreElement = document.getElementById("score");
const statusElement = document.getElementById("status");

let score = 1;
let updating = false;

function showScore(value) {
    score = Number.isFinite(Number(value)) ? Number(value) : 1;
    scoreElement.textContent = score;
}

function setStatus(text, error = false) {
    statusElement.textContent = text;
    statusElement.className = error
        ? "status error"
        : "status";
}

// 서버에서 점수 가져오기
async function loadScore() {
    try {
        const response = await fetch(API, {
            method: "GET",
            cache: "no-store"
        });

        if (response.status === 404) {
            // 처음 사용하는 경우
            await saveScore(1);
            showScore(1);
            setStatus("🟢 연결됨");
            return;
        }

        if (!response.ok) {
            throw new Error("GET " + response.status);
        }

        const data = await response.json();

        if (typeof data.score === "number") {
            showScore(data.score);
        } else {
            showScore(1);
        }

        setStatus("🟢 연결됨");

    } catch (error) {
        console.error(error);
        setStatus("🔴 연결 실패", true);
    }
}

// 서버에 점수 저장
async function saveScore(value) {
    const response = await fetch(API, {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            score: value
        })
    });

    if (!response.ok) {
        throw new Error("SAVE " + response.status);
    }
}

// + / -
async function changeScore(amount) {
    if (updating) return;

    updating = true;

    try {
        // 다른 기기에서 바뀐 최신 점수를 먼저 가져옴
        const response = await fetch(API, {
            method: "GET",
            cache: "no-store"
        });

        let current = score;

        if (response.ok) {
            const data = await response.json();

            if (typeof data.score === "number") {
                current = data.score;
            }
        }

        const newScore = current + amount;

        showScore(newScore);

        await saveScore(newScore);

        setStatus("🟢 저장됨");

    } catch (error) {
        console.error(error);
        setStatus("🔴 저장 실패", true);
    }

    updating = false;
}

// 다른 기기의 변경 감지
async function syncScore() {
    if (updating) return;

    try {
        const response = await fetch(API, {
            method: "GET",
            cache: "no-store"
        });

        if (!response.ok) return;

        const data = await response.json();

        if (typeof data.score === "number" && data.score !== score) {
            showScore(data.score);
        }

        setStatus("🟢 연결됨");

    } catch (error) {
        setStatus("🔴 연결 실패", true);
    }
}

document.getElementById("plus")
    .addEventListener("click", () => changeScore(1));

document.getElementById("minus")
    .addEventListener("click", () => changeScore(-1));

// 처음 불러오기
loadScore();

// 0.5초마다 다른 기기의 점수 확인
setInterval(syncScore, 500);
</script>

</body>
</html>
