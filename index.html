<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DuoMarst Point Calendar</title>

<style>
html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    min-height:100vh;
}

.app{
    width:min(1450px,94vw);
    height:100vh;
    margin:auto;
    padding:18px 0;
    display:grid;
    grid-template-rows:auto auto 1fr auto;
    gap:14px;
    overflow:hidden;
}

/* 상단 */
.topbar{
    margin:0;
    min-height:42px;
}

/* 포인트 메인 */
.hero{
    padding:20px 28px;
    border-radius:22px;
}

.hero-label{
    margin-bottom:3px;
}

.hero-date{
    margin-bottom:8px;
}

.score-number{
    font-size:clamp(48px,5vw,72px);
    letter-spacing:-4px;
}

.point-visual{
    margin-top:15px;
}

.quick{
    margin-top:13px;
}

/* 메인 영역 */
.content{
    min-height:0;
    margin:0;
    grid-template-columns:minmax(0,1fr) 280px;
}

/* 달력 */
.calendar-card{
    min-height:0;
    padding:17px;
    overflow:hidden;
}

.calendar-head{
    margin-bottom:10px;
}

.calendar-title{
    font-size:18px;
}

.weekdays{
    margin-bottom:4px;
}

.weekday{
    padding:4px 0;
}

.calendar{
    height:calc(100% - 65px);
    grid-auto-rows:1fr;
}

.day{
    min-height:0;
    padding:7px;
}

.day-score{
    margin-top:7px;
    font-size:15px;
}

.day-bar{
    bottom:6px;
}

/* 에디터 */
.editor{
    padding:18px;
    min-height:0;
}

.editor-title{
    font-size:17px;
}

.input-label{
    margin-top:15px;
}

.score-input{
    height:48px;
    font-size:21px;
}

.editor-preview{
    margin-top:9px;
    padding:10px;
}

.editor-buttons{
    margin-top:10px;
}

/* 통계 */
.stats{
    margin:0;
    gap:8px;
}

.stat{
    padding:10px 14px;
}

.stat-value{
    margin-top:3px;
    font-size:18px;
}

/* 작은 화면 */
@media(max-width:900px){

    .app{
        width:96vw;
        padding:12px 0;
        gap:9px;
    }

    .content{
        grid-template-columns:minmax(0,1fr) 230px;
    }

    .hero{
        padding:15px 20px;
    }

    .score-number{
        font-size:48px;
    }

    .point-visual{
        margin-top:10px;
    }

    .quick{
        margin-top:8px;
    }

    .quick button{
        padding:6px 10px;
        min-width:45px;
    }

    .calendar-card{
        padding:12px;
    }

    .editor{
        padding:12px;
    }
}

@media(max-width:650px){

    /*
      모바일에서는 달력/에디터를
      겹치게 하지 않고 한 화면에 맞춘다.
    */

    .app{
        padding:8px 0;
        gap:6px;
    }

    .topbar{
        min-height:32px;
    }

    .brand-name{
        font-size:16px;
    }

    .brand-sub{
        display:none;
    }

    .logo{
        width:32px;
        height:32px;
    }

    .sync{
        padding:5px 8px;
        font-size:10px;
    }

    .hero{
        padding:12px 15px;
        border-radius:16px;
    }

    .hero-label{
        font-size:9px;
    }

    .hero-date{
        font-size:11px;
        margin-bottom:5px;
    }

    .score-number{
        font-size:40px;
    }

    .score-unit{
        font-size:12px;
    }

    .point-visual{
        margin-top:7px;
    }

    .point-line-header{
        font-size:9px;
        margin-bottom:4px;
    }

    .point-track{
        height:10px;
    }

    .point-markers{
        display:none;
    }

    .quick{
        margin-top:7px;
        gap:4px;
    }

    .quick button{
        padding:4px 6px;
        min-width:0;
        font-size:11px;
    }

    .content{
        grid-template-columns:1fr;
        min-height:0;
    }

    .editor{
        display:none;
    }

    .calendar-card{
        padding:8px;
    }

    .calendar-head{
        margin-bottom:5px;
    }

    .calendar-title{
        font-size:15px;
    }

    .calendar-desc{
        display:none;
    }

    .month-buttons button{
        width:28px;
        height:28px;
    }

    .day{
        border-radius:7px;
        padding:4px;
    }

    .day-number{
        font-size:9px;
    }

    .day-score{
        margin-top:4px;
        font-size:12px;
    }

    .day-bar{
        left:4px;
        right:4px;
        bottom:4px;
    }

    .stats{
        grid-template-columns:repeat(4,1fr);
        gap:4px;
    }

    .stat{
        padding:6px;
        border-radius:8px;
    }

    .stat-label{
        font-size:7px;
    }

    .stat-value{
        font-size:13px;
    }

    .progress{
        margin-top:3px;
        height:3px;
    }
}
</style>
</head>

<body>

<div class="app">

    <header class="topbar">
        <div class="brand">
            <div class="logo">D</div>

            <div>
                <div class="brand-name">DuoMarst Points</div>
                <div class="brand-sub">2026.10 — 2027.03</div>
            </div>
        </div>

        <div class="sync">
            <span class="sync-dot"></span>
            <span id="syncText">Connecting...</span>
        </div>
    </header>


    <!-- POINT FIRST -->
    <section class="hero">

        <div class="hero-label">TODAY'S SCORE</div>

        <div class="hero-date" id="heroDate">
            2026년 10월 4일 일요일
        </div>

        <div class="score">
            <div class="score-number" id="todayScore">+0</div>
            <div class="score-unit">POINTS</div>
        </div>

        <div class="point-visual">

            <div class="point-line-header">
                <span class="point-line-title">
                    TODAY'S ACCUMULATION
                </span>

                <span
                    class="point-line-count"
                    id="pointLineCount"
                >
                    0 / 50
                </span>
            </div>

            <div class="point-track">
                <div
                    class="point-fill"
                    id="pointFill"
                ></div>
            </div>

            <div
                class="point-markers"
                id="pointMarkers"
            ></div>

        </div>


        <div class="quick">

            <button class="minus" data-delta="-10">−10</button>
            <button class="minus" data-delta="-5">−5</button>
            <button class="minus" data-delta="-1">−1</button>

            <button class="plus" data-delta="1">+1</button>
            <button class="plus" data-delta="5">+5</button>
            <button class="plus" data-delta="10">+10</button>

        </div>

    </section>


    <div class="content">

        <!-- CALENDAR -->
        <section class="card calendar-card">

            <div class="calendar-head">

                <div>
                    <div
                        class="calendar-title"
                        id="monthTitle"
                    >
                        2026년 10월
                    </div>

                    <div
                        class="calendar-desc"
                        id="monthDesc"
                    >
                        점수 기록
                    </div>
                </div>

                <div class="month-buttons">
                    <button id="prevMonth">‹</button>
                    <button id="nextMonth">›</button>
                </div>

            </div>


            <div class="weekdays">
                <div class="weekday">SUN</div>
                <div class="weekday">MON</div>
                <div class="weekday">TUE</div>
                <div class="weekday">WED</div>
                <div class="weekday">THU</div>
                <div class="weekday">FRI</div>
                <div class="weekday">SAT</div>
            </div>

            <div
                class="calendar"
                id="calendar"
            ></div>

        </section>


        <!-- EDITOR -->
        <aside class="card editor">

            <div class="editor-title">
                Point Editor
            </div>

            <div
                class="editor-date"
                id="selectedDate"
            >
                2026년 10월 4일
            </div>

            <label class="input-label">
                SELECTED DAY
            </label>

            <input
                class="score-input"
                id="scoreInput"
                type="number"
                value="0"
            >

            <div class="editor-preview">

                <div class="preview-label">
                    CURRENT VALUE
                </div>

                <div
                    class="preview-score"
                    id="editorScore"
                >
                    +0
                </div>

            </div>


            <div class="editor-buttons">

                <button id="minusButton">
                    −1
                </button>

                <button id="plusButton">
                    +1
                </button>

                <button
                    class="save"
                    id="saveButton"
                >
                    SAVE POINT
                </button>

                <button id="resetButton">
                    RESET
                </button>

            </div>

        </aside>

    </div>


    <!-- TOTAL STATS -->
    <section class="stats">

        <div class="stat">
            <div class="stat-label">TOTAL SCORE</div>
            <div
                class="stat-value"
                id="totalScore"
            >
                +0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">POSITIVE</div>
            <div
                class="stat-value"
                id="positiveScore"
            >
                +0
            </div>
        </div>

        <div class="stat">
            <div class="stat-label">NEGATIVE</div>
            <div
                class="stat-value"
                id="negativeScore"
            >
                0
            </div>
        </div>

        <div class="stat">

            <div class="stat-label">
                PERIOD PROGRESS
            </div>

            <div
                class="stat-value"
                id="progressText"
            >
                0%
            </div>

            <div class="progress">
                <div
                    class="progress-fill"
                    id="progressBar"
                ></div>
            </div>

        </div>

    </section>

</div>


<script>
const BASE_KEY =
    "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const API =
    "https://api.keyval.org";

const START =
    new Date(2026, 9, 1);

const END =
    new Date(2027, 2, 31);

const SYNC_MONTHS = [
    "2026-10",
    "2026-11",
    "2026-12",
    "2027-01",
    "2027-02",
    "2027-03"
];

let data = {};

let selectedDate =
    new Date(2026, 9, 4);

let currentMonth =
    new Date(2026, 9, 1);

let saving = false;


/* ---------- DATE ---------- */

function dateKey(date){

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    const d =
        String(date.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${d}`;
}


function monthKey(date){

    const y =
        date.getFullYear();

    const m =
        String(date.getMonth()+1)
        .padStart(2,"0");

    return `${y}-${m}`;
}


function isSameDay(a,b){

    return (
        a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate()
    );
}


function inRange(date){

    return (
        date >= START &&
        date <= END
    );
}


/* ---------- DATA ---------- */

function getScore(date){

    return Number(
        data[dateKey(date)] ?? 0
    );
}


function setScore(date,value){

    data[dateKey(date)] =
        Math.trunc(Number(value) || 0);
}


function formatScore(value){

    value = Number(value) || 0;

    return value > 0
        ? `+${value}`
        : `${value}`;
}


/* ---------- API ---------- */

async function getMonth(month){

    const key =
        `${BASE_KEY}-${month}`;

    const response =
        await fetch(
            `${API}/get/${key}`,
            {
                cache:"no-store"
            }
        );

    if(!response.ok){
        throw new Error("GET failed");
    }

    const raw =
        await response.text();

    let value =
        raw.trim();

    /*
      KeyVal 응답 형식이
      문자열 / JSON / {value:...}
      어느 쪽이어도 최대한 처리
    */

    try{

        const parsed =
            JSON.parse(value);

        if(typeof parsed === "string"){
            value = parsed;
        }
        else if(parsed?.value != null){
            value = parsed.value;
        }
        else if(
            parsed?.data?.value != null
        ){
            value = parsed.data.value;
        }

    }catch{}

    if(!value){
        return [];
    }

    if(Array.isArray(value)){
        return value.map(
            x => Number(x)||0
        );
    }

    return String(value)
        .split(",")
        .map(x => Number(x)||0);
}


async function saveMonth(month){

    const key =
        `${BASE_KEY}-${month}`;

    const days =
        new Date(
            Number(month.slice(0,4)),
            Number(month.slice(5,7)),
            0
        ).getDate();

    const values = [];

    for(
        let day = 1;
        day <= days;
        day++
    ){

        const date =
            `${month}-${String(day).padStart(2,"0")}`;

        values.push(
            Number(data[date] ?? 0)
        );
    }

    const value =
        values.join(",");

    const response =
        await fetch(
            `${API}/set/${key}/${encodeURIComponent(value)}`,
            {
                method:"GET",
                cache:"no-store"
            }
        );

    if(!response.ok){
        throw new Error("SET failed");
    }
}


/* ---------- LOAD ---------- */

async function loadData(){

    setSync("Loading...");

    try{

        const results =
            await Promise.all(
                SYNC_MONTHS.map(
                    month => getMonth(month)
                        .then(values => ({
                            month,
                            values
                        }))
                        .catch(() => ({
                            month,
                            values:null
                        }))
                )
            );

        for(const result of results){

            if(!result.values)
                continue;

            result.values.forEach(
                (score,index) => {

                    const date =
                        `${result.month}-${String(index+1).padStart(2,"0")}`;

                    data[date] = score;
                }
            );
        }

        setSync("Synced");

    }catch(error){

        console.error(error);

        setSync("Offline");
    }

    renderAll();
}


/* ---------- SAVE ---------- */

async function saveSelected(){

    if(saving)
        return;

    saving = true;

    const key =
        dateKey(selectedDate);

    const value =
        Math.trunc(
            Number(
                document.getElementById(
                    "scoreInput"
                ).value
            ) || 0
        );

    setScore(
        selectedDate,
        value
    );

    renderAll();

    setSync("Saving...");

    try{

        await saveMonth(
            monthKey(selectedDate)
        );

        setSync("Saved");

    }catch(error){

        console.error(error);

        setSync("Save failed");
    }

    saving = false;
}


/* ---------- RENDER ---------- */

function renderToday(){

    const score =
        getScore(selectedDate);

    const number =
        document.getElementById(
            "todayScore"
        );

    number.textContent =
        formatScore(score);

    number.style.color =
        score > 0
            ? "var(--cyan)"
            : score < 0
                ? "var(--red)"
                : "white";


    document.getElementById(
        "heroDate"
    ).textContent =
        selectedDate.toLocaleDateString(
            "ko-KR",
            {
                year:"numeric",
                month:"long",
                day:"numeric",
                weekday:"long"
            }
        );


    /*
      포인트 시각화

      0~50은 정확히 비례.
      50 이상은 꽉 찬 상태.
    */

    const positive =
        Math.max(score,0);

    const negative =
        Math.max(-score,0);

    const visual =
        Math.min(positive,50);

    document.getElementById(
        "pointFill"
    ).style.width =
        `${visual * 2}%`;


    document.getElementById(
        "pointLineCount"
    ).textContent =
        score >= 0
            ? `${positive} / 50`
            : `−${negative}`;


    const markers =
        document.getElementById(
            "pointMarkers"
        );

    markers.innerHTML = "";

    const count =
        Math.min(
            Math.max(Math.abs(score),1),
            50
        );

    for(
        let i=0;
        i<count;
        i++
    ){

        const marker =
            document.createElement("div");

        marker.className =
            "point-marker";

        if(score < 0){
            marker.classList.add(
                "negative"
            );
        }else{
            marker.classList.add(
                "active"
            );
        }

        markers.appendChild(marker);
    }
}


function renderCalendar(){

    const calendar =
        document.getElementById(
            "calendar"
        );

    calendar.innerHTML = "";


    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =
        `${year}년 ${month+1}월`;


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month+1,
            0
        ).getDate();


    /*
      앞/뒤 달 날짜는 표시하지 않고
      빈 칸만 만든다.
    */

    for(
        let i=0;
        i<firstDay;
        i++
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);
    }


    for(
        let day=1;
        day<=days;
        day++
    ){

        const date =
            new Date(
                year,
                month,
                day
            );

        const button =
            document.createElement("button");

        button.className =
            "day";

        if(
            isSameDay(
                date,
                selectedDate
            )
        ){
            button.classList.add(
                "selected"
            );
        }


        const today =
            new Date();

        if(
            isSameDay(
                date,
                today
            )
        ){
            button.classList.add(
                "today"
            );
        }


        const score =
            getScore(date);


        const scoreClass =
            score > 0
                ? "positive"
                : score < 0
                    ? "negative"
                    : "zero";


        const bar =
            Math.min(
                Math.abs(score) * 5,
                100
            );


        button.innerHTML = `
            <div class="day-number">
                ${day}
            </div>

            <div class="day-score ${scoreClass}">
                ${formatScore(score)}
            </div>

            <div
                class="day-bar"
                style="--bar:${bar}%"
            ></div>
        `;


        button.addEventListener(
            "click",
            () => {

                selectedDate =
                    new Date(date);

                currentMonth =
                    new Date(
                        date.getFullYear(),
                        date.getMonth(),
                        1
                    );

                renderAll();
            }
        );


        calendar.appendChild(button);
    }


    /*
      뒤쪽 빈칸
    */

    const total =
        firstDay + days;

    const remaining =
        (7 - (total % 7)) % 7;

    for(
        let i=0;
        i<remaining;
        i++
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);
    }
}


function renderEditor(){

    const score =
        getScore(selectedDate);

    document.getElementById(
        "selectedDate"
    ).textContent =
        selectedDate.toLocaleDateString(
            "ko-KR",
            {
                year:"numeric",
                month:"long",
                day:"numeric",
                weekday:"long"
            }
        );


    document.getElementById(
        "scoreInput"
    ).value =
        score;


    document.getElementById(
        "editorScore"
    ).textContent =
        formatScore(score);
}


function renderStats(){

    let total = 0;
    let positive = 0;
    let negative = 0;
    let active = 0;

    Object.values(data).forEach(
        value => {

            value =
                Number(value)||0;

            total += value;

            if(value > 0)
                positive += value;

            if(value < 0)
                negative += value;

            if(value !== 0)
                active++;
        }
    );


    document.getElementById(
        "totalScore"
    ).textContent =
        formatScore(total);


    document.getElementById(
        "positiveScore"
    ).textContent =
        `+${positive}`;


    document.getElementById(
        "negativeScore"
    ).textContent =
        negative;


    const totalDays =
        Math.round(
            (
                END - START
            ) /
            86400000
        ) + 1;


    const percent =
        Math.round(
            active /
            totalDays *
            100
        );


    document.getElementById(
        "progressText"
    ).textContent =
        `${percent}%`;


    document.getElementById(
        "progressBar"
    ).style.width =
        `${percent}%`;
}


function renderAll(){

    renderToday();
    renderCalendar();
    renderEditor();
    renderStats();
}


/* ---------- SYNC UI ---------- */

function setSync(text){

    document.getElementById(
        "syncText"
    ).textContent =
        text;
}


/* ---------- QUICK POINTS ---------- */

document.querySelectorAll(
    "[data-delta]"
).forEach(button => {

    button.addEventListener(
        "click",
        () => {

            const delta =
                Number(
                    button.dataset.delta
                );

            const current =
                getScore(selectedDate);

            setScore(
                selectedDate,
                current + delta
            );

            document.getElementById(
                "scoreInput"
            ).value =
                getScore(selectedDate);

            renderAll();

            saveSelected();
        }
    );
});


/* ---------- EDITOR ---------- */

document.getElementById(
    "scoreInput"
).addEventListener(
    "input",
    () => {

        const value =
            Number(
                document.getElementById(
                    "scoreInput"
                ).value
            ) || 0;

        document.getElementById(
            "editorScore"
        ).textContent =
            formatScore(value);
    }
);


document.getElementById(
    "minusButton"
).addEventListener(
    "click",
    () => {

        const value =
            getScore(selectedDate) - 1;

        setScore(
            selectedDate,
            value
        );

        renderAll();
    }
);


document.getElementById(
    "plusButton"
).addEventListener(
    "click",
    () => {

        const value =
            getScore(selectedDate) + 1;

        setScore(
            selectedDate,
            value
        );

        renderAll();
    }
);


document.getElementById(
    "saveButton"
).addEventListener(
    "click",
    saveSelected
);


document.getElementById(
    "resetButton"
).addEventListener(
    "click",
    () => {

        setScore(
            selectedDate,
            0
        );

        renderAll();
    }
);


/* ---------- MONTH ---------- */

document.getElementById(
    "prevMonth"
).addEventListener(
    "click",
    () => {

        const next =
            new Date(
                currentMonth.getFullYear(),
                currentMonth.getMonth()-1,
                1
            );

        if(
            next < new Date(2026,9,1)
        )
            return;

        currentMonth = next;

        renderCalendar();
    }
);


document.getElementById(
    "nextMonth"
).addEventListener(
    "click",
    () => {

        const next =
            new Date(
                currentMonth.getFullYear(),
                currentMonth.getMonth()+1,
                1
            );

        if(
            next > new Date(2027,2,1)
        )
            return;

        currentMonth = next;

        renderCalendar();
    }
);


/* ---------- START ---------- */

renderAll();
loadData();

</script>

</body>
</html>
