<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>System Score</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #07090c;
    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

.system {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
}

/* 중앙 시스템 */
.panel {
    position: relative;

    width: 380px;
    height: 380px;

    background: #000;
    border: 1px solid #24272c;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    pointer-events: auto;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.015),
        0 25px 80px rgba(0,0,0,.65);
}

/* 모서리 시스템 마커 */
.corner {
    position: absolute;
    width: 13px;
    height: 13px;
    border-color: #858b94;
    opacity: .75;
}

.c1 {
    top: -1px;
    left: -1px;
    border-top: 1px solid;
    border-left: 1px solid;
}

.c2 {
    top: -1px;
    right: -1px;
    border-top: 1px solid;
    border-right: 1px solid;
}

.c3 {
    bottom: -1px;
    left: -1px;
    border-bottom: 1px solid;
    border-left: 1px solid;
}

.c4 {
    bottom: -1px;
    right: -1px;
    border-bottom: 1px solid;
    border-right: 1px solid;
}

/* 상단 */
.header {
    position: absolute;
    top: 24px;
    left: 28px;
    right: 28px;

    display: flex;
    justify-content: space-between;
    align-items: center;

    color: #777d86;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.status {
    display: flex;
    align-items: center;
    gap: 7px;
}

.status-dot {
    width: 5px;
    height: 5px;
    background: #34c759;
    box-shadow: 0 0 8px rgba(52,199,89,.5);
}

/* 점수 */
.score {
    color: #f5f5f5;

    font-size: 104px;
    font-weight: 300;

    line-height: 1;
    letter-spacing: -6px;

    user-select: none;

    transition:
        transform .18s cubic-bezier(.2,.8,.2,1),
        opacity .18s ease;
}

.score.pop {
    animation: scorePop .2s ease;
}

@keyframes scorePop {
    0% {
        transform: scale(.88);
        opacity: .3;
    }

    100% {
        transform: scale(1);
        opacity: 1;
    }
}

/* 얇은 기준선 */
.line {
    width: 150px;
    height: 1px;
    background: #24272c;
    margin: 24px 0 20px;
}

/* 컨트롤 */
.controls {
    display: flex;
    gap: 8px;
}

button {
    width: 54px;
    height: 38px;

    border: 1px solid #292d33;
    background: #090a0c;
    color: #bfc3c8;

    font-size: 18px;
    font-weight: 300;

    cursor: pointer;

    transition:
        background .12s ease,
        border-color .12s ease,
        color .12s ease,
        transform .12s ease;
}

button:hover {
    background: #15171a;
    border-color: #50555d;
    color: white;
}

button:active {
    transform: scale(.94);
    background: #202328;
}

/* 하단 */
.footer {
    position: absolute;
    bottom: 23px;
    left: 28px;
    right: 28px;

    display: flex;
    justify-content: space-between;

    color: #4f545c;
    font-size: 9px;
    letter-spacing: 1.5px;
}

#statusText {
    transition: color .2s ease;
}

/* 아주 약한 화면 비네팅 */
.vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 25%,
            rgba(0,0,0,.22) 70%,
            rgba(0,0,0,.55) 100%
        );
}
</style>
</head>

<body>

<canvas id="network"></canvas>

<div class="vignette"></div>

<div class="system">
    <main class="panel">

        <div class="corner c1"></div>
        <div class="corner c2"></div>
        <div class="corner c3"></div>
        <div class="corner c4"></div>

        <div class="header">
            <span>SCORE / SYS</span>

            <div class="status">
                <span class="status-dot" id="statusDot"></span>
                <span id="statusText">연결 중</span>
            </div>
        </div>

        <div id="score" class="score">1</div>

        <div class="line"></div>

        <div class="controls">
            <button id="minus">−</button>
            <button id="plus">+</button>
        </div>

        <div class="footer">
            <span>SHARED STATE</span>
            <span>LIVE</span>
        </div>

    </main>
</div>

<script>
/* =========================
   NETWORK BACKGROUND
========================= */

const canvas = document.getElementById("network");
const ctx = canvas.getContext("2d");

let width;
let height;
let dpr;

const nodes = [];
const NODE_COUNT = 65;

let mouseX = 0;
let mouseY = 0;

function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width * dpr;
    canvas.height = height * dpr;

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function createNodes() {
    nodes.length = 0;

    for (let i = 0; i < NODE_COUNT; i++) {
        nodes.push({
            x: Math.random() * width,
            y: Math.random() * height,

            vx: (Math.random() - .5) * .12,
            vy: (Math.random() - .5) * .12,

            z: Math.random(),
            size: Math.random() * 1.4 + .5
        });
    }
}

function drawNetwork() {
    ctx.clearRect(0, 0, width, height);

    for (const n of nodes) {
        n.x += n.vx;
        n.y += n.vy;

        if (n.x < -30) n.x = width + 30;
        if (n.x > width + 30) n.x = -30;

        if (n.y < -30) n.y = height + 30;
        if (n.y > height + 30) n.y = -30;
    }

    /* 연결선 */
    for (let i = 0; i < nodes.length; i++) {

        const a = nodes[i];

        for (let j = i + 1; j < nodes.length; j++) {

            const b = nodes[j];

            const dx = a.x - b.x;
            const dy = a.y - b.y;

            const distance = Math.sqrt(
                dx * dx + dy * dy
            );

            if (distance < 145) {

                const alpha =
                    (1 - distance / 145) *
                    .24 *
                    (0.35 + (a.z + b.z) / 2);

                ctx.beginPath();

                ctx.strokeStyle =
                    `rgba(145,150,158,${alpha})`;

                ctx.lineWidth = .55;

                ctx.moveTo(a.x, a.y);
                ctx.lineTo(b.x, b.y);

                ctx.stroke();
            }
        }
    }

    /* 점 */
    for (const n of nodes) {

        const depth = .45 + n.z * .75;

        const px =
            n.x +
            (mouseX - width / 2) *
            n.z *
            .012;

        const py =
            n.y +
            (mouseY - height / 2) *
            n.z *
            .012;

        ctx.beginPath();

        ctx.fillStyle =
            `rgba(210,215,222,${.3 + n.z * .45})`;

        ctx.arc(
            px,
            py,
            n.size * depth,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    requestAnimationFrame(drawNetwork);
}

window.addEventListener("resize", () => {
    resize();
    createNodes();
});

window.addEventListener("pointermove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
});

resize();
createNodes();
drawNetwork();


/* =========================
   SCORE SYSTEM
========================= */

const KEY =
    "6b61bbfa-2a71-4b89-948f-b0d0c41a18f7";

const GET_URL =
    "https://api.keyval.org/get/" + KEY;

const SET_URL = value =>
    "https://api.keyval.org/set/" +
    KEY + "/" +
    encodeURIComponent(String(value));


const scoreEl =
    document.getElementById("score");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");


let score = 1;
let busy = false;


function render(value, animate = true) {

    score = Number(value);

    if (!Number.isFinite(score)) {
        score = 1;
    }

    scoreEl.textContent = score;

    if (!animate) return;

    scoreEl.classList.remove("pop");

    void scoreEl.offsetWidth;

    scoreEl.classList.add("pop");

    setTimeout(() => {
        scoreEl.classList.remove("pop");
    }, 200);
}


function setConnection(ok) {

    if (ok) {

        statusText.textContent = "연결됨";

        statusText.style.color =
            "#858b94";

        statusDot.style.background =
            "#34c759";

    } else {

        statusText.textContent =
            "연결 실패";

        statusText.style.color =
            "#ff453a";

        statusDot.style.background =
            "#ff453a";
    }
}


async function getScore() {

    const response = await fetch(
        GET_URL + "?t=" + Date.now(),
        {
            cache: "no-store"
        }
    );

    const body =
        (await response.text()).trim();

    if (!response.ok) {
        throw new Error(
            "GET " +
            response.status +
            ": " +
            body
        );
    }

    let value = body;

    try {

        const json =
            JSON.parse(value);

        if (
            typeof json === "object" &&
            json !== null
        ) {
            value =
                json.val ??
                json.value ??
                json.data ??
                value;
        }

    } catch {}

    const number =
        Number(String(value).trim());

    if (!Number.isFinite(number)) {
        throw new Error("잘못된 점수");
    }

    return number;
}


async function saveScore(value) {

    const response =
        await fetch(
            SET_URL(value),
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            "SET " + response.status
        );
    }
}


async function sync() {

    if (busy) return;

    try {

        const value =
            await getScore();

        /*
         * DB와 현재 화면이 같으면
         * 절대로 애니메이션 실행 안 함
         */
        if (value !== score) {
            render(value, true);
        }

        setConnection(true);

    } catch (error) {

        console.error(error);

        setConnection(false);
    }
}


async function change(amount) {

    if (busy) return;

    busy = true;

    try {

        const current =
            await getScore();

        const next =
            current + amount;

        render(next, true);

        await saveScore(next);

        setConnection(true);

    } catch (error) {

        console.error(error);

        setConnection(false);
    }

    busy = false;
}


document
    .getElementById("minus")
    .addEventListener(
        "click",
        () => change(-1)
    );


document
    .getElementById("plus")
    .addEventListener(
        "click",
        () => change(1)
    );


sync();

setInterval(sync, 1000);
</script>

</body>
</html>
